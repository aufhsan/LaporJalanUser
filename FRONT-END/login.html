<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#092e6d">
  <title>Masuk — KotaKita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --navy: #092e6d;
      --teal: #27afa5;
      --input-border: rgba(9, 46, 109, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Inter", Arial, sans-serif;
      color: var(--navy);
      background: linear-gradient(
        110deg,
        #ffffff 0%,
        #a8bfe7 100%
      );
      -webkit-font-smoothing: antialiased;
    }

    /* Mengubah .page menjadi flex container sama seperti registPage */
    .page {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 20px;
      overflow: hidden;
      isolation: isolate;
    }

    /* Penempatan ilustrasi dekoratif disamakan dengan registPage */
    .decoration {
      position: absolute;
      z-index: -1;
      bottom: -50px;
      left: -20px;
      width: 32vw;
      max-width: 500px;
      min-width: 280px;
      height: auto;
      opacity: 0.35;
      pointer-events: none;
    }

    .login {
      width: min(480px, 100%);
      margin: 0 auto;
      padding: 0;
      text-align: center;
    }

    .login__title {
      margin: 0 0 28px;
      font-size: clamp(28px, 2.083333vw, 36px);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.03em;
    }

    .login__form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .login__input {
      width: 100%;
      height: 48px;
      padding: 0 21px;
      border: 1px solid var(--input-border);
      border-radius: 16px;
      outline: none;
      background: #ffffff;
      color: var(--navy);
      font: 600 14px / 20px "Inter", Arial, sans-serif;
      transition:
        border-color 150ms ease,
        box-shadow 150ms ease;
    }

    .login__input::placeholder {
      color: rgba(9, 46, 109, 0.7);
      opacity: 1;
    }

    .login__input:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(9, 46, 109, 0.12);
    }

    .login__button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      margin-top: 10px;
      padding: 14px 21px;
      border: none;
      border-radius: 16px;
      background: var(--navy);
      color: #ffffff;
      font: 600 14px / 20px "Inter", Arial, sans-serif;
      cursor: pointer;
      transition: background-color 150ms ease;
    }

    .login__button svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .login__button:hover {
      background: #15417f;
    }

    .login__forgot {
      display: inline-block;
      margin-top: 16px;
      color: var(--navy);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      text-decoration: none;
    }

    .login__forgot:hover {
      text-decoration: underline;
    }

    .login__button:focus-visible,
    .login__forgot:focus-visible {
      outline: 3px solid var(--teal);
      outline-offset: 4px;
    }

    .login__notice.is-ok { border-color: #8fd0c9; background: #e8f7f5; color: #11635b; }
    
    @media (max-width: 600px) {
      .login__title {
        margin-bottom: 24px;
        font-size: 28px;
      }

      .login__input {
        font-size: 15px;
      }

      .decoration {
        bottom: -60px;
        left: -60px;
        width: 280px;
        opacity: 0.2;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .login__input,
      .login__button {
        transition: none;
      }
    }
  

/* Responsive mobile layout — desktop styles remain unchanged */
@media (max-width: 767px) {
  html { overflow-x: hidden; }
  body { zoom: 1 !important; overflow-x: hidden; }
  .header {
    top: 8px !important;
    left: 8px !important;
    right: 8px !important;
    min-height: 0 !important;
    height: auto !important;
    padding: 10px 12px !important;
    display: flex !important;
    flex-flow: row wrap !important;
    align-items: center !important;
    justify-content: space-between !important;
    column-gap: 8px !important;
    row-gap: 10px !important;
    border-radius: 16px !important;
  }
  .header > .brand { order: 1 !important; flex: 0 1 auto !important; min-width: 0; gap: 5px !important; font-size: clamp(16px, 4.5vw, 21px) !important; white-space: nowrap; }
  .header > .brand svg { width: 22px !important; height: 30px !important; }
  .header > .city-picker { order: 2 !important; flex: 0 0 auto !important; height: 34px !important; padding: 0 9px !important; gap: 4px !important; font-size: 12px !important; white-space: nowrap; }
  .header > .city-picker .icon { width: 16px !important; height: 16px !important; }
  .header > .header__actions { display: contents !important; }
  .header .points { order: 3 !important; flex: 0 0 auto !important; height: 34px !important; padding: 0 9px !important; gap: 5px !important; font-size: 12px !important; white-space: nowrap; }
  .header .points .coin { width: 17px !important; height: 17px !important; font-size: 10px !important; }
  .header > .profile { order: 4 !important; display: inline-flex !important; flex: 0 0 34px !important; width: 34px !important; height: 34px !important; align-items: center !important; justify-content: center !important; margin: 0 !important; }
  .header > .profile .icon { width: 22px !important; height: 22px !important; }
  .header > .navigation { order: 5 !important; flex: 0 0 100% !important; width: 100% !important; min-width: 0 !important; margin: 0 !important; padding: 2px 0 0 !important; display: flex !important; flex-flow: row nowrap !important; align-items: center !important; justify-content: space-between !important; gap: clamp(6px, 2.5vw, 14px) !important; overflow-x: auto !important; scrollbar-width: none; }
  .header > .navigation::-webkit-scrollbar { display: none; }
  .header > .navigation a { flex: 0 0 auto !important; font-size: clamp(10px, 2.8vw, 13px) !important; line-height: 1.3 !important; padding: 7px 0 !important; white-space: nowrap !important; }
  .header > .navigation a.active::after { height: 2px !important; bottom: 0 !important; }
  body { padding-top: 112px; }
  img, video, iframe, canvas, svg { max-width: 100%; }
  main, .main-content, .main-content, .content, .page-content, .container, .wrapper, .dashboard-content, .content-wrapper {
    max-width: 100% !important;
  }
  main, .main-content, .content, .page-content, .dashboard-content, .content-wrapper { width: auto; }
  .main-content, .content, .page-content, .dashboard-content, .content-wrapper { margin-left: 12px !important; margin-right: 12px !important; }
  input, select, textarea { max-width: 100%; }
  table { display: block; max-width: 100%; overflow-x: auto; }
}
@media (max-width: 420px) {
  .header { padding: 8px 9px !important; column-gap: 5px !important; }
  .header > .brand { gap: 3px !important; font-size: 16px !important; }
  .header > .city-picker { padding: 0 7px !important; }
  .header .points { padding: 0 7px !important; }
  .header > .navigation { gap: 7px !important; }
  .header > .navigation a { font-size: 10px !important; }
}
/* >>> MOBILE-OPT >>> */
@media (max-width: 767px) {
  body { padding-top: 0 !important; }
  .page { padding: 16px !important; min-height: 100svh; }
  .login, .registration, .welcome { width: 100% !important; max-width: 340px; }
  .login__title, .registration__title { font-size: 22px !important; margin-bottom: 18px !important; }
  .login__input, .registration__input { height: 42px !important; padding: 0 16px !important; font-size: 13px !important; border-radius: 13px !important; }
  .login__button, .registration__button, .welcome__start { min-height: 42px !important; padding: 10px 16px !important; font-size: 13px !important; border-radius: 13px !important; }
  .login__forgot, .welcome__account { font-size: 12.5px !important; margin-top: 12px !important; }
  .welcome__logo { width: 52% !important; max-width: 180px !important; }
  .welcome__tagline { font-size: 12.5px !important; margin: 8px 0 14px !important; }
}
/* <<< MOBILE-OPT <<< */

    /* Pesan error & notifikasi login */
    .login__notice {
      padding: 12px 16px;
      border: 1px solid #e0a3a3;
      border-radius: 12px;
      background: #fdeeee;
      color: #8a1f1f;
      font: 600 13px / 18px "Inter", Arial, sans-serif;
    }
    .login__notice[hidden], .login__error[hidden] { display: none; }
    .login__error {
      margin: -6px 0 0 8px;
      color: #b42318;
      font: 600 12px / 16px "Inter", Arial, sans-serif;
    }
    .login__input[aria-invalid="true"] { border-color: #b42318; }
    .login__button:disabled { opacity: .7; cursor: not-allowed; }
  </style>
</head>

<body>
  <main class="page">
    <!-- Pendekatan ilustrasi logo KotaKita menggunakan SVG -->
    <svg
      class="decoration"
      viewBox="0 0 616 843"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
    >
      <!-- Penanda lokasi -->
      <path
        fill="#092e6d"
        fill-rule="evenodd"
        d="
          M243 0
          C149 0 73 76 73 170
          C73 258 172 373 243 442
          C314 373 413 258 413 170
          C413 76 337 0 243 0
          Z

          M243 97
          A73 73 0 1 1 243 243
          A73 73 0 1 1 243 97
          Z
        "
      />

      <!-- Bangunan kiri -->
      <path
        fill="#378deb"
        d="
          M26 453
          L137 404
          Q151 398 151 417
          L151 700
          Q100 720 49 721
          Q26 721 26 697
          Z
        "
      />

      <!-- Bangunan tengah -->
      <path
        fill="#4da6cc"
        d="
          M184 487
          L383 341
          L383 552
          L184 683
          Z
        "
      />

      <!-- Bangunan kanan -->
      <path
        fill="#378deb"
        d="
          M442 215
          Q442 204 456 210
          L561 256
          Q575 262 575 277
          L575 511
          Q506 509 442 533
          Z
        "
      />

      <!-- Lengkungan bawah -->
      <path
        fill="#27afa5"
        d="
          M58 765
          C159 790 250 730 349 662
          C416 616 492 568 556 563
          Q575 561 575 582
          C574 727 480 822 341 841
          C228 856 126 826 58 765
          Z
        "
      />
    </svg>

    <section class="login" aria-labelledby="login-title">
      <h1 class="login__title" id="login-title">
        Masuk
      </h1>

      <form class="login__form" id="formLogin" novalidate>
        <div class="login__notice" id="loginNotice" role="alert" aria-live="polite" hidden></div>

        <input
          class="login__input"
          type="text"
          id="username"
          name="username"
          placeholder="Username"
          aria-label="Username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
        >
        <p class="login__error" id="err-username" hidden></p>

        <input
          class="login__input"
          type="password"
          id="password"
          name="password"
          placeholder="Kata sandi"
          aria-label="Kata sandi"
          autocomplete="current-password"
          required
        >
        <p class="login__error" id="err-password" hidden></p>

        <button class="login__button" id="btnMasuk" type="submit">
          <span>Masuk</span>

          <svg
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M4 12h16m-6-6 6 6-6 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </form>

      <a class="login__forgot" href="login.html">
        Lupa Kata Sandi?
      </a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/login.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const go = (url) => { if (url) window.location.href = url; };
  document.querySelectorAll('form').forEach(form => form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (form.classList.contains('registration__form')) { go('login.html'); return; }
    if (form.querySelector('input[type="file"]')) { go('detail-after-UploadLaporan.html'); return; }
  }));
  document.querySelectorAll('.issue-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.issue-btn').forEach(x => x.classList.remove('selected')); btn.classList.add('selected');
  }));
  document.querySelectorAll('.filter').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(x => x.classList.remove('active')); btn.classList.add('active');
  }));
  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    const c=btn.className; if(c.includes('vouchers')) go('Profil-Poin(Semua).html#voucher'); else if(c.includes('history')) go('rekamLaporan.html'); else go('Profil-Poin(Semua).html');
  }));
  document.querySelectorAll('.save').forEach(btn => btn.addEventListener('click', () => { alert('Perubahan berhasil disimpan.'); }));
  document.querySelectorAll('.logout').forEach(btn => btn.addEventListener('click', () => go('welcome.html')));
  document.querySelectorAll('.btn-confirm').forEach(btn => btn.addEventListener('click', () => go('detail-after-UploadLaporan.html')));
  document.querySelectorAll('.detail-button.withdraw').forEach(btn => btn.addEventListener('click', () => { if(confirm('Tarik laporan ini?')) go('rekamLaporan.html'); }));
  document.querySelectorAll('.download').forEach(btn => btn.addEventListener('click', () => {
    const blob=new Blob(['Riwayat laporan KotaKita'],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='riwayat-laporan.txt'; a.click(); URL.revokeObjectURL(a.href);
  }));
  document.querySelectorAll('.redeem:not(:disabled)').forEach(btn => btn.addEventListener('click', () => alert('Penukaran poin dipilih. Konfirmasi transaksi memerlukan backend aplikasi.')));
  document.querySelectorAll('.action').forEach(btn => btn.addEventListener('click', () => alert(btn.classList.contains('feedback')?'Terima kasih atas masukan Anda.':'Silakan gunakan kanal kontak resmi KotaKita.')));
  document.querySelectorAll('.city-picker').forEach(btn => btn.addEventListener('click', () => {
    const city=prompt('Masukkan nama kota:', 'Bandung'); if(city&&city.trim()){btn.setAttribute('aria-label','Kota '+city.trim()); const t=Array.from(btn.childNodes).find(n=>n.nodeType===3&&n.textContent.trim()); if(t)t.textContent=' '+city.trim()+' ';}
  }));
  document.querySelectorAll('.avatar-upload').forEach(btn => btn.addEventListener('click', () => {
    let i=document.querySelector('#avatar-file'); if(!i){i=document.createElement('input');i.type='file';i.id='avatar-file';i.accept='image/*';i.hidden=true;document.body.appendChild(i);} i.click();
  }));
  document.querySelectorAll('.location-card__edit-btn').forEach(btn => btn.addEventListener('click', () => go('lokasi.html')));
});
</script>
</body>
</html>
