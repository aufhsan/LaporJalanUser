<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil • Informasi — KotaKita</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #092e6d;
      --text: #131b2e;
      --surface: #f7fbfd;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--navy);
      background: linear-gradient(90deg, #fff 0%, #d5e1f4 57.2%, #a8bfe7 100%);
      zoom: 0.67; /* Disamakan dengan detailLaporan.html */
      -webkit-font-smoothing: antialiased;
    }

    button, a {
      font: inherit;
      color: inherit;
    }

    button {
      padding: 0;
      border: 0;
      cursor: pointer;
    }

    a {
      text-decoration: none;
    }

    img, p, h1, h2, h3 {
      margin: 0;
      display: block;
    }

    .icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* Header Navbar Glassmorphism (Sama persis dengan detailLaporan.html) */
    .header {
      position: fixed;
      top: 15px;
      left: 17px;
      right: 17px;
      z-index: 1000;
      min-height: 96px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.45), rgba(177,201,242,0.3));
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 32px rgba(9,46,109,0.12);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--navy);
      font-size: 32px;
      font-weight: 700;
    }

    .city-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 16px;
      border: 1px solid var(--navy);
      border-radius: 58px;
      background: rgba(247,251,253,0.4);
      color: var(--navy);
      font-size: 18px;
      font-weight: 500;
    }

    .city-picker .icon-arrow {
      transform: rotate(90deg);
      width: 18px;
      height: 18px;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-left: auto;
    }

    .navigation a {
      position: relative;
      padding: 12px 0;
      color: var(--navy);
      font-size: 20px;
      font-weight: 500;
    }

    .navigation a.active {
      font-weight: 600;
    }

    .navigation a.active::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -2px;
      left: 0;
      height: 4px;
      border-radius: 4px;
      background: var(--navy);
    }

    .header__actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-left: 20px;
    }

    .points {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 18px;
      border-radius: 58px;
      background: linear-gradient(135deg, #3280f3, #0c336c);
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
    }

    .coin {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 2px solid #ffe588;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffdf6d, #ffb300);
      color: #7a4b00;
      font-size: 14px;
      font-weight: 900;
    }
.profile {
      display: grid;
      place-items: center;
      width: 49px;
      height: 49px;
      border-radius: 50%;
      background: #b2d1ff;
      color: var(--navy);
    }


    /* Konten utama: struktur accordion (mengikuti KotaKita – Informasi) */
    main {
      width: 1503px;
      margin: 166px auto 60px;
    }

    .crumb {
      margin: 0 0 40px;
      font-size: 32px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.24px;
    }

    h1 {
      margin: 0 0 40px;
      font-size: 36px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.24px;
    }

    .frame {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      align-items: start;
      padding: 28px;
      border-radius: 45px;
      background: #06306f;
    }

    .col {
      padding: 47px 37px 40px;
      border-radius: 40px;
      background: var(--surface);
      color: var(--navy);
    }

    .col h2 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.24px;
    }

    .col > p {
      margin: 8px 0 28px;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 0.24px;
      color: rgba(9, 46, 109, 0.65);
    }

    .item {
      border-top: 1px solid #b0c7eb;
    }

    .item > button {
      all: unset;
      box-sizing: border-box;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 0;
      cursor: pointer;
    }

    .item > button:focus-visible {
      outline: 2px solid #3280f3;
      outline-offset: 2px;
      border-radius: 6px;
    }

    .item .t {
      flex: 1;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.24px;
    }

    .item .t small {
      display: block;
      margin-top: 6px;
      font-size: 20px;
      font-weight: 400;
      color: rgba(9, 46, 109, 0.65);
    }

    .item svg {
      width: 25px;
      height: 25px;
      flex: none;
      fill: none;
      stroke: var(--navy);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform .2s;
    }

    .item.open svg { transform: rotate(90deg); }
    .item.faq.open svg { transform: rotate(180deg); }

    .body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .22s ease;
    }

    .item.open .body { grid-template-rows: 1fr; }

    .body > div {
      overflow: hidden;
      font-size: 20px;
      line-height: 1.55;
      color: var(--navy);
    }

    .body .in { padding: 2px 0 22px; }
    .body ol, .body ul { margin: 0 0 12px; padding-left: 26px; }
    .body li { margin-bottom: 5px; }
    .body p { margin: 0 0 12px; }

    .tip {
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(9, 46, 109, 0.07);
      font-size: 18px;
      color: rgba(9, 46, 109, 0.75);
    }

    .st {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 14px;
      margin: 0 0 12px;
    }

    .st b { font-weight: 700; }

    .dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      border-radius: 50%;
      vertical-align: -1px;
    }

    .cta {
      display: grid;
      gap: 12px;
      margin-top: 28px;
    }

    .cta button, .sheet .p {
      height: 56px;
      border-radius: 15px;
      font: inherit;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.24px;
      cursor: pointer;
    }

    .p {
      border: 0;
      background: var(--navy);
      color: #fff;
    }

    .s {
      border: 1px solid #49a3ee;
      background: #d3e9fb;
      color: var(--navy);
    }

    .sheet {
      display: none;
      margin-top: 14px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(9, 46, 109, 0.07);
      font-size: 20px;
      line-height: 1.5;
    }

    .sheet.show { display: block; }
    .sheet label { display: block; margin: 12px 0 5px; font-weight: 700; }

    .sheet select, .sheet textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #b0c7eb;
      border-radius: 10px;
      background: var(--surface);
      color: var(--navy);
      font: inherit;
    }

    .sheet textarea { min-height: 96px; resize: vertical; }
    .sheet .p { width: 100%; margin-top: 14px; }

    @media (prefers-reduced-motion: reduce) {
      .body, .item svg { transition: none; }
    }


/* Responsive mobile layout — desktop styles remain unchanged */

  .header {

  body { padding-top: 112px; }
  img, video, iframe, canvas, svg { max-width: 100%; }

  input, select, textarea { max-width: 100%; }
  table { display: block; max-width: 100%; overflow-x: auto; }
}
@media (max-width: 420px) {
  .header { padding: 8px 9px !important; column-gap: 5px !important; }
  .header > .brand { gap: 3px !important; font-size: 16px !important; }
  .header > .city-picker { padding: 0 7px !important; }
  .header .points { padding: 0 7px !important; }
  .header > .navigation { gap: 7px !important; }
  .header > .navigation a { font-size: 10px !important; }
}

  body { padding-top: 100px; }
  main { width: auto !important; margin: 0 12px 24px !important; }
  .crumb { font-size: 13px; margin: 4px 2px 8px; }

</style>
</head>

<body>
  <!-- SVG Symbols untuk Icon Navbar -->
  <svg style="display:none">
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a8 8 0 0 0-8 8c0 6 8 12 8 12s8-6 8-12a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></symbol>
    <symbol id="icon-profile" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z" fill="currentColor"/></symbol>
  </svg>

  <!-- Navbar Glassmorphism (Sama seperti detailLaporan.html) -->
  <header class="header">
    <a class="brand" href="welcome.html">
      <svg width="37" height="50" viewBox="0 0 40 54">
        <path fill="#092e6d" fill-rule="evenodd" d="M18 0C10 0 4 6 4 14c0 8 14 21 14 21s14-13 14-21C32 6 26 0 18 0Zm0 8a6 6 0 1 1 0 12 6 6 0 1 1 0-12Z"/>
        <path fill="#378deb" d="M0 33l10-4v19L0 51Zm28-7 12-6v25l-12 4Z"/>
        <path fill="#4da6cc" d="m13 40 12-11v17l-12 7Z"/>
        <path fill="#27afa5" d="M2 52c15 3 24-15 38-13-1 12-14 19-38 13Z"/>
      </svg>
      <span>KotaKita</span>
    </a>

    <button class="city-picker" type="button">
      <svg class="icon"><use href="#icon-pin"/></svg>
      <span>Bandung</span>
    </button>

    <nav class="navigation">
      <a href="dashboard.html">Beranda</a>
      <a href="lokasi.html">Lokasi</a>
      <a href="uploadLaporan.html">Upload Laporan</a>
      <a href="laporan.html">Laporan</a>
    </nav>

    <div class="header__actions">
      <a class="points" href="Profil-Poin(Semua).html" style="text-decoration:none;color:#FFFFFF;cursor:pointer"><span class="coin">★</span><span>0 Poin</span></a>
      </div>
      <a class="profile" href="Profil.html"><svg class="icon"><use href="#icon-profile"/></svg></a>
    </div>
  </header>
  <main>
    <p class="crumb">Profil<strong> • Informasi</strong></p>
    <h1>Informasi</h1>

    <div class="frame">
      <section class="col" id="c1"><h2>Informasi</h2><p>Panduan menggunakan KotaKita</p></section>
      <section class="col" id="c2"><h2>Dukungan / FAQ</h2><p>Pertanyaan yang sering diajukan</p></section>
      <section class="col" id="c3"><h2>Tentang Aplikasi</h2><p>KotaKita — lapor, pantau, dan jaga kota bersama</p></section>
    </div>
  </main>

<script>
const chev='<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const chevD='<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
const dots=[['#2fa866','Hijau','Aman, belum ada laporan aktif'],['#f0c322','Kuning','Laporan ringan, perlu waspada'],['#f08a24','Oranye','Laporan sedang (jalan rusak, genangan)'],['#d63a3a','Merah','Titik rawan, hindari jika bisa']];
const data={
c1:[
['Cara upload laporan','Foto, lokasi & kategori',`<ol><li>Buka menu <b>Upload Laporan</b>.</li><li>Ambil foto atau pilih dari galeri (maks. 3 foto, JPG/PNG, 5 MB per foto).</li><li>Lokasi terisi otomatis dari GPS. Geser pin kalau kurang tepat.</li><li>Pilih kategori: Jalan Rusak, Sampah, Lampu Jalan, Banjir/Drainase, Fasilitas Umum, Lainnya.</li><li>Tulis deskripsi singkat, lalu tekan <b>Kirim</b>. Kamu dapat nomor laporan untuk dipantau.</li></ol><div class="tip">Foto jelas dan deskripsi spesifik bikin laporan lebih cepat diverifikasi.</div>`],
['Alur verifikasi laporan','Dari menunggu sampai selesai',`<div class="st"><b>Menunggu</b><span>Laporan masuk dan antre dicek.</span><b>Diverifikasi</b><span>Tim cek foto, lokasi, dan kategori.</span><b>Diproses</b><span>Diteruskan ke instansi terkait.</span><b>Selesai</b><span>Masalah ditangani, kamu dapat notifikasi.</span><b>Ditolak</b><span>Tidak memenuhi syarat. Alasannya tampil di detail laporan.</span></div><div class="tip">Cek status kapan saja di menu Laporan.</div>`],
['Sistem poin','Cara dapat & tukar poin',`<ul><li>Laporan terkirim: <b>+5</b></li><li>Laporan terverifikasi: <b>+10</b></li><li>Laporan selesai ditangani: <b>+15</b></li><li>Bonus laporan pertama: <b>+20</b></li></ul><p>Tukar poin lewat badge poin di navbar: pilih hadiah, lalu konfirmasi.</p><div class="tip">Poin dicabut jika laporan terbukti palsu atau spam.</div>`],
['Membaca peta & rute aman','Arti warna & penanda',`<div class="st">${dots.map(d=>`<span><i class="dot" style="background:${d[0]}"></i><b>${d[1]}</b></span><span>${d[2]}</span>`).join('')}</div><p>Satu pin = satu laporan. Ketuk pin untuk lihat detail. Rute aman menghindari titik merah dan oranye.</p>`]],
c2:[
['Berapa lama laporan diproses?','',`<p>Rata-rata 3 sampai 14 hari kerja, tergantung kategori dan kompleksitas. Laporan darurat seperti pohon tumbang atau jalan amblas diprioritaskan.</p>`,1],
['Kenapa laporan saya ditolak?','',`<ul><li>Foto buram atau tidak sesuai laporan</li><li>Lokasi tidak jelas atau di luar area layanan</li><li>Laporan duplikat</li><li>Konten tidak relevan atau mengandung SARA/data pribadi</li></ul><p>Kamu bisa kirim ulang setelah data diperbaiki.</p>`,1],
['Bagaimana cara menukar poin?','',`<p>Ketuk badge poin di navbar, pilih hadiah, tekan <b>Tukar</b>, lalu konfirmasi. Hadiah dikirim maksimal 3 hari kerja.</p>`,1],
['Apakah identitas saya aman?','',`<p>Data pribadimu tidak tampil di laporan publik. Yang tampil hanya foto, lokasi, dan deskripsi laporan. Detail lengkap ada di Kebijakan Privasi.</p>`,1]],
c3:[
['Versi aplikasi','v1.0.0',`<ul><li>Rilis: Oktober 2026</li><li>Fitur: upload laporan, peta interaktif, rute aman, sistem poin</li></ul>`],
['Kebijakan privasi','Cara data kamu dipakai',`<ul><li>Data yang dikumpulkan: nama, email, lokasi, foto laporan</li><li>Dipakai untuk verifikasi laporan dan peningkatan layanan</li><li>Tidak dijual ke pihak ketiga</li><li>Kamu bisa minta hapus akun dan data kapan saja</li></ul>`],
['Syarat & ketentuan','Aturan penggunaan',`<ul><li>Laporan harus benar dan sesuai fakta</li><li>Dilarang spam, hoaks, atau konten SARA/pornografi</li><li>Pelanggaran bisa membuat poin dicabut atau akun dinonaktifkan</li></ul>`],
['Lisensi & kredit','Data peta & pihak ketiga',`<ul><li>Peta: © OpenStreetMap contributors</li><li>Font: Inter. Ikon: sumber ikon yang dipakai</li><li>Library open-source dan tim pengembang KotaKita</li></ul>`]]};

Object.entries(data).forEach(([id,items])=>{
  const col=document.getElementById(id);
  items.forEach(([t,s,b,faq])=>{
    const el=document.createElement('div');
    el.className='item'+(faq?' faq':'');
    el.innerHTML=`<button aria-expanded="false"><span class="t">${t}${s?`<small>${s}</small>`:''}</span>${faq?chevD:chev}</button><div class="body"><div><div class="in">${b}</div></div></div>`;
    const btn=el.querySelector('button');
    btn.onclick=()=>{const o=el.classList.toggle('open');btn.setAttribute('aria-expanded',o)};
    col.appendChild(el);
  });
});
document.getElementById('c2').insertAdjacentHTML('beforeend',`<div class="cta"><button class="p" data-s="hub">Hubungi Kami</button><button class="s" data-s="msk">Kirim Masukan</button></div>
<div class="sheet" id="hub"><b>Hubungi Kami</b><br>Email: support@kotakita.id<br>Senin–Jumat, 08.00–16.00 WIB</div>
<div class="sheet" id="msk"><label for="jn">Jenis masukan</label><select id="jn"><option>Saran</option><option>Bug</option><option>Lainnya</option></select><label for="ps">Pesan</label><textarea id="ps" placeholder="Ceritakan masukanmu"></textarea><button class="p" id="kirimMasukan" type="button">Kirim masukan</button><p id="msStatus" role="status" style="margin:10px 0 0;font-weight:600"></p></div>`);
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
  ['hub','msk'].forEach(i=>{const e=document.getElementById(i);e.classList.toggle('show',i===b.dataset.s&&!e.classList.contains('show'))});
});
document.querySelectorAll('.city-picker').forEach(btn=>btn.addEventListener('click',()=>{
  const city=prompt('Masukkan nama kota:','Bandung');
  if(city&&city.trim()){btn.setAttribute('aria-label','Kota '+city.trim());const t=Array.from(btn.childNodes).find(n=>n.nodeType===3&&n.textContent.trim());if(t)t.textContent=' '+city.trim()+' ';}
}));
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/masukan.js"></script>
<script src="js/poin.js"></script>
<script src="js/lokasiKota.js"></script>
</body>
</html>
