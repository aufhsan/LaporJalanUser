<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin - Lapor Jalan</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f6f9; color: #333; }
        header { background: #343a40; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        header span { font-weight: bold; font-size: 18px; }
        .page { padding: 20px; max-width: 1150px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn { background: #6f42c1; color: white; padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; }
        .btn:disabled { background: #ccc; }
        .btn-out { background: #dc3545; }
        .btn-hijau { background: #2f9e44; }
        .btn-abu { background: #868e96; }
        input[type=email], input[type=password] { width: 100%; box-sizing: border-box; padding: 12px; margin: 6px 0 14px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        #boxLogin { max-width: 380px; margin: 60px auto; }
        #pesanLogin { color: #dc3545; font-size: 14px; margin-top: 10px; }
        #dashboard { display: none; }

        /* Statistik */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 18px; }
        .stat { background: white; border-radius: 10px; padding: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 6px solid #6f42c1; }
        .stat .angka { font-size: 28px; font-weight: bold; }
        .stat .ket { font-size: 13px; color: #666; }
        .stat.dikonfirmasi { border-color: #7048e8; } .stat.ditolak { border-color: #e03131; } .stat.baru { border-color: #868e96; } .stat.diproses { border-color: #1c7ed6; } .stat.selesai { border-color: #2f9e44; }

        /* Toolbar */
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        .toolbar input[type=search], .toolbar select { padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .toolbar input[type=search] { flex: 1; min-width: 180px; }
        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        .filter-bar .label { font-weight: bold; font-size: 14px; margin-right: 4px; }
        .fbtn { padding: 8px 14px; border: 2px solid #ccc; background: white; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 600; color: #444; transition: 0.15s; }
        .fbtn:hover { border-color: #888; }
        .fbtn.aktif { color: white; border-color: transparent; }
        .fbtn.aktif[data-f="semua"] { background: #343a40; }
        .fbtn.aktif[data-f="ringan"] { background: #f2b705; color: #333; }
        .fbtn.aktif[data-f="sedang"] { background: #ff922b; }
        .fbtn.aktif[data-f="parah"] { background: #e03131; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; text-transform: capitalize; }
        .badge.ringan { background: #f2b705; color: #333; }
        .badge.sedang { background: #ff922b; }
        .badge.parah { background: #e03131; }
        .pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 3px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.5); position: relative; }
        .pin::after { content: ''; position: absolute; width: 8px; height: 8px; background: white; border-radius: 50%; top: 6px; left: 6px; }
        .legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; margin-bottom: 10px; }
        .legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

        #map { height: 380px; width: 100%; border-radius: 10px; margin-bottom: 20px; }
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: top; }
        th { background: #343a40; color: white; white-space: nowrap; }
        tr:hover { background: #f8f9fa; }
        tr.selesai-row { opacity: 0.6; }
        .img-thumbnail { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; cursor: pointer; }
        td.desk { min-width: 180px; max-width: 260px; word-break: break-word; }
        td.kode { font-family: monospace; font-size: 12px; white-space: nowrap; }
        .catatan-kecil { margin-top: 6px; font-size: 12px; color: #856404; background: #fff9db; padding: 4px 6px; border-radius: 4px; }
        select.sel-status { padding: 6px; border-radius: 6px; border: 2px solid #ccc; font-weight: 600; font-size: 13px; }
        select.sel-status.baru { border-color: #868e96; }
        select.sel-status.dikonfirmasi { border-color: #7048e8; color: #7048e8; }
        select.sel-status.ditolak { border-color: #e03131; color: #e03131; }
        select.sel-status.diproses { border-color: #1c7ed6; color: #1c7ed6; }
        select.sel-status.selesai { border-color: #2f9e44; color: #2f9e44; }
        .aksi { display: flex; gap: 5px; flex-wrap: wrap; }
        .aksi a, .aksi button { padding: 6px 10px; font-size: 12px; border-radius: 5px; border: none; color: white; cursor: pointer; text-decoration: none; white-space: nowrap; }
        .a-peta { background: #6f42c1; } .a-cat { background: #1c7ed6; } .a-hapus { background: #dc3545; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="boxLogin" class="card">
        <h2 style="margin-top:0">🔐 Login Admin</h2>
        <label>Email</label>
        <input type="email" id="inEmail" autocomplete="username">
        <label>Password</label>
        <input type="password" id="inPass" autocomplete="current-password">
        <button class="btn" id="btnLogin" style="width:100%">Masuk</button>
        <div id="pesanLogin"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <header>
            <span>💻 Dashboard Admin - Lapor Jalan</span>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-abu" id="btnMuat">🔄 Muat Ulang</button>
                <button class="btn btn-out" id="btnLogout">Keluar</button>
            </div>
        </header>
        <div class="page">

            <div class="stats" id="stats"></div>

            <div class="toolbar">
                <input type="search" id="inCari" placeholder="🔍 Cari deskripsi / kode laporan...">
                <select id="selStatus">
                    <option value="semua">Semua status</option>
                    <option value="baru">🆕 Baru</option>
                    <option value="dikonfirmasi">☑️ Dikonfirmasi</option>
                    <option value="diproses">🛠️ Diproses</option>
                    <option value="selesai">✅ Selesai</option>
                    <option value="ditolak">⛔ Ditolak</option>
                </select>
                <button class="btn btn-hijau" id="btnCsv">⬇️ Ekspor CSV</button>
            </div>

            <div class="filter-bar" id="filterBar">
                <span class="label">🔎 Tingkat:</span>
                <button class="fbtn aktif" data-f="semua">Semua (0)</button>
                <button class="fbtn" data-f="ringan">🟡 Ringan (0)</button>
                <button class="fbtn" data-f="sedang">🟠 Sedang (0)</button>
                <button class="fbtn" data-f="parah">🔴 Parah (0)</button>
            </div>

            <div class="legenda">
                <span><i style="background:#f2b705"></i>Ringan</span>
                <span><i style="background:#ff922b"></i>Sedang</span>
                <span><i style="background:#e03131"></i>Parah</span>
                <span style="color:#777">• Pin pudar = sudah selesai</span>
            </div>
            <div id="map"></div>

            <div class="card">
                <h3 style="margin-top:0">Daftar Laporan <span id="jumlahTampil" style="font-weight:normal; color:#777; font-size:14px;"></span></h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr><th>Foto</th><th>Kode</th><th>Tingkat</th><th>Status</th><th>Deskripsi</th><th>Waktu</th><th>Koordinat</th><th>Aksi</th></tr>
                        </thead>
                        <tbody id="tabelLaporan"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://ilmnhyyarurqszcyidnx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsbW5oeXlhcnVycXN6Y3lpZG54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1Nzc0MzQsImV4cCI6MjEwNzE1MzQzNH0.sbvZvD_WOHvpTpwy6dc9Kcdql4BLqKjQR10v5VmJrFo";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const $ = id => document.getElementById(id);
        const WARNA = { ringan: '#f2b705', sedang: '#ff922b', parah: '#e03131' };
        const COLSPAN = 8;

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        const tingkatValid = r => ['ringan', 'sedang', 'parah'].includes(r.tingkat) ? r.tingkat : null;
        // 'menunggu'/'terkirim' (dari aplikasi pengguna) dianggap Baru; 'diverifikasi' = Dikonfirmasi
        const statusValid = r => {
            const s = String(r.status || '').toLowerCase();
            if (s === 'diverifikasi' || s === 'terverifikasi') return 'dikonfirmasi';
            return ['dikonfirmasi', 'diproses', 'selesai', 'ditolak'].includes(s) ? s : 'baru';
        };

        function buatIkon(tingkat) {
            const warna = WARNA[tingkat] || '#6c757d';
            return L.divIcon({
                className: '',
                html: `<div class="pin" style="background:${warna};"></div>`,
                iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -26]
            });
        }

        // ---------- Peta ----------
        let map = null;
        let penandaPeta = [];
        function initPeta() {
            if (map) return;
            try {
                map = L.map('map').setView([-2.5489, 118.0149], 5);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
            } catch (e) { console.error("Peta gagal dimuat:", e); }
        }

        // ---------- Login ----------
        function tampilkanDashboard() {
            $('boxLogin').style.display = "none";
            $('dashboard').style.display = "block";
            initPeta();
            if (map) setTimeout(() => map.invalidateSize(), 200);
            muatData();
        }
        function tampilkanLogin() {
            $('dashboard').style.display = "none";
            $('boxLogin').style.display = "block";
        }

        db.auth.getSession().then(({ data }) => { if (data.session) tampilkanDashboard(); });

        $('btnLogin').addEventListener('click', async () => {
            $('pesanLogin').innerText = "";
            $('btnLogin').disabled = true;
            const { error } = await db.auth.signInWithPassword({
                email: $('inEmail').value.trim(),
                password: $('inPass').value
            });
            $('btnLogin').disabled = false;
            if (error) { $('pesanLogin').innerText = "Login gagal: " + error.message; return; }
            $('inPass').value = "";
            tampilkanDashboard();
        });
        $('inPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnLogin').click(); });
        $('btnLogout').addEventListener('click', async () => { await db.auth.signOut(); tampilkanLogin(); });
        $('btnMuat').addEventListener('click', muatData);

        // ---------- Data & filter ----------
        let semuaLaporan = [];
        let filterTingkat = 'semua';
        let filterStatus = 'semua';
        let kataCari = '';
        let sedangTampil = [];

        function updateStatistik() {
            const c = { baru: 0, dikonfirmasi: 0, diproses: 0, selesai: 0, ditolak: 0 };
            semuaLaporan.forEach(r => c[statusValid(r)]++);
            $('stats').innerHTML = `
                <div class="stat"><div class="angka">${semuaLaporan.length}</div><div class="ket">Total laporan</div></div>
                <div class="stat baru"><div class="angka">${c.baru}</div><div class="ket">🆕 Baru</div></div>
                <div class="stat dikonfirmasi"><div class="angka">${c.dikonfirmasi}</div><div class="ket">☑️ Dikonfirmasi</div></div>
                <div class="stat diproses"><div class="angka">${c.diproses}</div><div class="ket">🛠️ Diproses</div></div>
                <div class="stat selesai"><div class="angka">${c.selesai}</div><div class="ket">✅ Selesai</div></div>
                <div class="stat ditolak"><div class="angka">${c.ditolak}</div><div class="ket">⛔ Ditolak</div></div>`;
        }

        function updateTombolFilter() {
            const hitung = { semua: semuaLaporan.length, ringan: 0, sedang: 0, parah: 0 };
            semuaLaporan.forEach(r => { const t = tingkatValid(r); if (t) hitung[t]++; });
            const nama = { semua: 'Semua', ringan: '🟡 Ringan', sedang: '🟠 Sedang', parah: '🔴 Parah' };
            document.querySelectorAll('.fbtn').forEach(b => {
                const f = b.dataset.f;
                b.textContent = `${nama[f]} (${hitung[f]})`;
                b.classList.toggle('aktif', f === filterTingkat);
            });
        }

        $('filterBar').addEventListener('click', e => {
            const b = e.target.closest('.fbtn');
            if (!b) return;
            filterTingkat = b.dataset.f;
            updateTombolFilter();
            tampilkanLaporan(true);
        });
        $('selStatus').addEventListener('change', e => { filterStatus = e.target.value; tampilkanLaporan(true); });
        $('inCari').addEventListener('input', e => { kataCari = e.target.value.trim().toLowerCase(); tampilkanLaporan(false); });

        async function muatData() {
            $('tabelLaporan').innerHTML = `<tr><td colspan="${COLSPAN}" style="text-align:center">Memuat data laporan...</td></tr>`;
            try {
                const { data: logs, error } = await db.from('laporan_jalan').select('*').order('waktu', { ascending: false });
                if (error) throw error;
                semuaLaporan = logs || [];
                updateStatistik();
                updateTombolFilter();
                tampilkanLaporan(true);
            } catch (err) {
                console.error(err);
                $('tabelLaporan').innerHTML = `<tr><td colspan="${COLSPAN}" style="text-align:center">Gagal memuat data: ${esc(err.message)}</td></tr>`;
            }
        }

        function lolosFilter(r) {
            if (filterTingkat !== 'semua' && tingkatValid(r) !== filterTingkat) return false;
            if (filterStatus !== 'semua' && statusValid(r) !== filterStatus) return false;
            if (kataCari) {
                const teks = ((r.deskripsi || '') + ' ' + (r.kode || '')).toLowerCase();
                if (!teks.includes(kataCari)) return false;
            }
            return true;
        }

        function tampilkanLaporan(geserPeta) {
            const tabel = $('tabelLaporan');
            tabel.innerHTML = "";
            if (map) penandaPeta.forEach(m => map.removeLayer(m));
            penandaPeta = [];

            sedangTampil = semuaLaporan.filter(lolosFilter);
            $('jumlahTampil').innerText = `(${sedangTampil.length} dari ${semuaLaporan.length})`;

            if (semuaLaporan.length === 0) {
                tabel.innerHTML = `<tr><td colspan="${COLSPAN}" style="text-align:center">Belum ada data laporan masuk.</td></tr>`;
                return;
            }
            if (sedangTampil.length === 0) {
                tabel.innerHTML = `<tr><td colspan="${COLSPAN}" style="text-align:center">Tidak ada laporan yang cocok dengan filter.</td></tr>`;
                return;
            }

            const titik = [];
            sedangTampil.forEach(r => {
                const waktu = new Date(r.waktu).toLocaleString('id-ID');
                const tingkat = tingkatValid(r);
                const status = statusValid(r);
                const foto = esc(r.foto_url);
                const badge = tingkat ? `<span class="badge ${tingkat}">${tingkat}</span>` : '<i style="color:#999">-</i>';

                const tr = document.createElement('tr');
                if (status === 'selesai' || status === 'ditolak') tr.className = 'selesai-row';
                tr.innerHTML = `
                    <td><img src="${foto}" class="img-thumbnail"></td>
                    <td class="kode">${esc(r.kode || '-')}</td>
                    <td>${badge}</td>
                    <td>
                        <select class="sel-status ${status}">
                            <option value="baru">🆕 Baru</option>
                            <option value="dikonfirmasi">☑️ Dikonfirmasi (+15 poin)</option>
                            <option value="diproses">🛠️ Diproses</option>
                            <option value="selesai">✅ Selesai (+25 poin)</option>
                            <option value="ditolak">⛔ Ditolak</option>
                        </select>
                    </td>
                    <td class="desk">${r.deskripsi ? esc(r.deskripsi) : '<i style="color:#999">-</i>'}
                        ${r.catatan_admin ? `<div class="catatan-kecil">💬 ${esc(r.catatan_admin)}</div>` : ''}</td>
                    <td>${esc(waktu)}</td>
                    <td>${Number(r.latitude).toFixed(6)}, ${Number(r.longitude).toFixed(6)}</td>
                    <td><div class="aksi">
                        <a class="a-peta" href="https://www.google.com/maps?q=${Number(r.latitude)},${Number(r.longitude)}" target="_blank">🗺️ Peta</a>
                        <button class="a-cat">💬 Catatan</button>
                        <button class="a-hapus">🗑️ Hapus</button>
                    </div></td>`;

                const sel = tr.querySelector('.sel-status');
                sel.value = status;
                sel.addEventListener('change', () => ubahStatus(r, sel.value, sel));
                tr.querySelector('img').addEventListener('click', () => window.open(r.foto_url, '_blank'));
                tr.querySelector('.a-cat').addEventListener('click', () => editCatatan(r));
                tr.querySelector('.a-hapus').addEventListener('click', () => hapusLaporan(r));
                tabel.appendChild(tr);

                if (map) {
                    const mk = L.marker([r.latitude, r.longitude], { icon: buatIkon(tingkat), opacity: status === 'selesai' ? 0.45 : 1 }).addTo(map)
                        .bindPopup(`<b>${esc(r.kode || 'Laporan')}</b> ${badge}<br>Status: <b>${status}</b><br>${esc(waktu)}<br>${r.deskripsi ? esc(r.deskripsi) + '<br>' : ''}<img src="${foto}" style="width:140px;margin-top:5px;border-radius:5px;">`);
                    penandaPeta.push(mk);
                }
                titik.push([r.latitude, r.longitude]);
            });

            if (map && geserPeta && titik.length) {
                if (titik.length === 1) map.setView(titik[0], 15);
                else map.fitBounds(L.latLngBounds(titik), { padding: [40, 40], maxZoom: 16 });
            }
        }

        // ---------- Aksi admin ----------
        async function perbarui(r, perubahan) {
            const { data, error } = await db.from('laporan_jalan').update(perubahan).eq('id', r.id).select();
            if (error) throw error;
            if (!data || data.length === 0) throw new Error("Tidak ada baris yang berubah. Cek policy UPDATE & kolom id di Supabase.");
            Object.assign(r, perubahan);
        }

        async function ubahStatus(r, nilai, selEl) {
            const lama = statusValid(r);
            selEl.disabled = true;
            try {
                await perbarui(r, { status: nilai });
                const info = { dikonfirmasi: 'Pelapor mendapat +15 poin (sekali per laporan).', diproses: 'Pelapor mendapat +15 poin (sekali per laporan).', selesai: 'Pelapor mendapat +15 dan +25 poin (masing-masing sekali per laporan).' }[nilai];
                if (info) alert('Status diperbarui. ' + info);
                updateStatistik();
                tampilkanLaporan(false);
            } catch (err) {
                alert("Gagal mengubah status: " + err.message);
                selEl.value = lama;
                selEl.disabled = false;
            }
        }

        async function editCatatan(r) {
            const baru = prompt("Catatan untuk pelapor (akan terlihat saat mereka cek status):", r.catatan_admin || "");
            if (baru === null) return;
            try {
                await perbarui(r, { catatan_admin: baru.trim() || null });
                tampilkanLaporan(false);
            } catch (err) { alert("Gagal menyimpan catatan: " + err.message); }
        }

        async function hapusLaporan(r) {
            if (!confirm(`Hapus laporan ${r.kode || ''} secara permanen? Foto juga akan dihapus.`)) return;
            try {
                const { data, error } = await db.from('laporan_jalan').delete().eq('id', r.id).select();
                if (error) throw error;
                if (!data || data.length === 0) throw new Error("Tidak ada baris yang terhapus. Cek policy DELETE & kolom id di Supabase.");

                // Hapus file foto dari storage (kalau gagal, abaikan)
                const m = String(r.foto_url || '').match(/foto_laporan\/([^?]+)/);
                if (m) await db.storage.from('foto_laporan').remove([decodeURIComponent(m[1])]).catch(() => {});

                semuaLaporan = semuaLaporan.filter(x => x !== r);
                updateStatistik();
                updateTombolFilter();
                tampilkanLaporan(false);
            } catch (err) { alert("Gagal menghapus: " + err.message); }
        }

        // ---------- Ekspor CSV (sesuai filter yang sedang tampil) ----------
        function selCsv(v) {
            let s = String(v ?? '');
            if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;   // cegah formula injection di Excel
            return '"' + s.replace(/"/g, '""') + '"';
        }
        $('btnCsv').addEventListener('click', () => {
            if (!sedangTampil.length) { alert("Tidak ada data untuk diekspor."); return; }
            const kolom = ['kode', 'waktu', 'tingkat', 'status', 'deskripsi', 'latitude', 'longitude', 'foto_url', 'catatan_admin'];
            const baris = [kolom.join(',')].concat(
                sedangTampil.map(r => kolom.map(k => selCsv(k === 'status' ? statusValid(r) : r[k])).join(','))
            );
            const blob = new Blob(["\uFEFF" + baris.join("\r\n")], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `laporan-jalan-${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        });
    </script>
</body>
</html>
