<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Terkirim — KotaKita</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #092e6d;
      --text: #131b2e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background: linear-gradient(90deg, #fff 0%, #d5e1f4 57.2%, #a8bfe7 100%);
      zoom: 0.67; /* Disamakan dengan detailLaporan2-5.html */
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    img, p, h1 { margin: 0; display: block; }
    .icon { width: 24px; height: 24px; flex-shrink: 0; }

    /* Header Navbar Glassmorphism (Sama dengan detailLaporan2-5.html) */
    .header {
      position: fixed;
      top: 15px;
      left: 17px;
      right: 17px;
      z-index: 1000;
      min-height: 96px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.45), rgba(177,201,242,0.3));
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 32px rgba(9,46,109,0.12);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--navy);
      font-size: 32px;
      font-weight: 700;
    }

    .city-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 16px;
      border: 1px solid var(--navy);
      border-radius: 58px;
      background: rgba(247,251,253,0.4);
      color: var(--navy);
      font-size: 18px;
      font-weight: 500;
    }

    .city-picker .icon-arrow {
      transform: rotate(90deg);
      width: 18px;
      height: 18px;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-left: auto;
    }

    .navigation a {
      position: relative;
      padding: 12px 0;
      color: var(--navy);
      font-size: 20px;
      font-weight: 500;
    }

    .navigation a.active {
      font-weight: 600;
    }

    .navigation a.active::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -2px;
      left: 0;
      height: 4px;
      border-radius: 4px;
      background: var(--navy);
    }

    .header__actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-left: 20px;
    }

    .points {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 18px;
      border-radius: 58px;
      background: linear-gradient(135deg, #3280f3, #0c336c);
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
    }

    .coin {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 2px solid #ffe588;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffdf6d, #ffb300);
      color: #7a4b00;
      font-size: 14px;
      font-weight: 900;
    }
.profile {
      display: grid;
      place-items: center;
      width: 49px;
      height: 49px;
      border-radius: 50%;
      background: #b2d1ff;
      color: var(--navy);
    }

    /* Layout Content Container */
    .content-container {
      position: relative;
      width: 1517px;
      height: 850px;
      margin: 140px auto 40px;
    }

    .abs { position: absolute; }

    .heading {
      left: 0;
      top: 0;
      font-size: 32px;
      font-weight: 700;
      color: var(--navy);
    }

    /* Icon Ceklis Sukses */
    .success-icon-box {
      left: 567px;
      top: 150px;
      width: 382px;
      height: 382px;
    }

    .success-title {
      left: 0;
      right: 0;
      top: 560px;
      text-align: center;
      font-size: 36px;
      font-weight: 700;
      color: #0c2b64;
    }

    /* Action Buttons */
    .buttons-wrapper {
      position: absolute;
      top: 640px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 24px;
    }

    .button {
      width: 280px;
      height: 55px;
      border: 0;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .button:hover {
      opacity: 0.9;
    }

    .home-button {
      background: #1b3871;
      color: #ffffff;
    }

    .detail-button {
      border: 1px solid #b3d6f7;
      background: #d6e8fb;
      color: #1b3871;
    }
  

/* Responsive mobile layout — desktop styles remain unchanged */
@media (max-width: 767px) {
  html { overflow-x: hidden; }
  body { zoom: 1 !important; overflow-x: hidden; }
  .header {
    top: 8px !important;
    left: 8px !important;
    right: 8px !important;
    min-height: 0 !important;
    height: auto !important;
    padding: 10px 12px !important;
    display: flex !important;
    flex-flow: row wrap !important;
    align-items: center !important;
    justify-content: space-between !important;
    column-gap: 8px !important;
    row-gap: 10px !important;
    border-radius: 16px !important;
  }
  .header > .brand { order: 1 !important; flex: 0 1 auto !important; min-width: 0; gap: 5px !important; font-size: clamp(16px, 4.5vw, 21px) !important; white-space: nowrap; }
  .header > .brand svg { width: 22px !important; height: 30px !important; }
  .header > .city-picker { order: 2 !important; flex: 0 0 auto !important; height: 34px !important; padding: 0 9px !important; gap: 4px !important; font-size: 12px !important; white-space: nowrap; }
  .header > .city-picker .icon { width: 16px !important; height: 16px !important; }
  .header > .header__actions { display: contents !important; }
  .header .points { order: 3 !important; flex: 0 0 auto !important; height: 34px !important; padding: 0 9px !important; gap: 5px !important; font-size: 12px !important; white-space: nowrap; }
  .header .points .coin { width: 17px !important; height: 17px !important; font-size: 10px !important; }
  .header > .profile { order: 4 !important; display: inline-flex !important; flex: 0 0 34px !important; width: 34px !important; height: 34px !important; align-items: center !important; justify-content: center !important; margin: 0 !important; }
  .header > .profile .icon { width: 22px !important; height: 22px !important; }
  .header > .navigation { order: 5 !important; flex: 0 0 100% !important; width: 100% !important; min-width: 0 !important; margin: 0 !important; padding: 2px 0 0 !important; display: flex !important; flex-flow: row nowrap !important; align-items: center !important; justify-content: space-between !important; gap: clamp(6px, 2.5vw, 14px) !important; overflow-x: auto !important; scrollbar-width: none; }
  .header > .navigation::-webkit-scrollbar { display: none; }
  .header > .navigation a { flex: 0 0 auto !important; font-size: clamp(10px, 2.8vw, 13px) !important; line-height: 1.3 !important; padding: 7px 0 !important; white-space: nowrap !important; }
  .header > .navigation a.active::after { height: 2px !important; bottom: 0 !important; }
  body { padding-top: 112px; }
  img, video, iframe, canvas, svg { max-width: 100%; }
  main, .main-content, .main-content, .content, .page-content, .container, .wrapper, .dashboard-content, .content-wrapper {
    max-width: 100% !important;
  }
  main, .main-content, .content, .page-content, .dashboard-content, .content-wrapper { width: auto; }
  .main-content, .content, .page-content, .dashboard-content, .content-wrapper { margin-left: 12px !important; margin-right: 12px !important; }
  input, select, textarea { max-width: 100%; }
  table { display: block; max-width: 100%; overflow-x: auto; }
}
@media (max-width: 420px) {
  .header { padding: 8px 9px !important; column-gap: 5px !important; }
  .header > .brand { gap: 3px !important; font-size: 16px !important; }
  .header > .city-picker { padding: 0 7px !important; }
  .header .points { padding: 0 7px !important; }
  .header > .navigation { gap: 7px !important; }
  .header > .navigation a { font-size: 10px !important; }
}
/* >>> MOBILE-OPT >>> */
@media (max-width: 767px) {
  body { padding-top: 100px; }
  .content-container { width: auto !important; height: auto !important; margin: 0 12px 24px !important; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .content-container > * { position: static !important; }
  .heading { align-self: flex-start; font-size: 18px !important; }
  .success-icon-box { width: 140px !important; height: 140px !important; margin-top: 24px; }
  .success-title { font-size: 20px !important; margin: 0 !important; }
  .buttons-wrapper { width: 100%; flex-direction: column; gap: 10px !important; margin-top: 8px; }
  .button { width: 100% !important; height: 46px !important; font-size: 14px !important; border-radius: 13px !important; }
}
/* <<< MOBILE-OPT <<< */
</style>
  <style id="kk-data-style">
    [hidden] { display: none !important; }
    .success-code { left: 0; right: 0; top: 612px; text-align: center; font-size: 24px; font-weight: 600;
      letter-spacing: .5px; color: #1b3871; word-break: break-all; }
    .success-summary { left: 140px; right: 140px; top: 652px; text-align: center; font-size: 18px;
      line-height: 1.4; color: #3e6099; }
    @media (min-width: 768px) { .buttons-wrapper { top: 730px; } }
    @media (max-width: 767px) {
      .success-code { font-size: 15px; }
      .success-summary { font-size: 13px; margin: 0 8px; text-align: center; }
    }
  </style>
  <style id="kk-guard">html{visibility:hidden}</style>
</head>

<body>
  <!-- SVG Symbols -->
  <svg style="display:none">
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a8 8 0 0 0-8 8c0 6 8 12 8 12s8-6 8-12a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></symbol>
    <symbol id="icon-profile" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z" fill="currentColor"/></symbol>
  </svg>

  <!-- Navbar Glassmorphism -->
  <header class="header">
    <a class="brand" href="welcome.html">
      <svg width="37" height="50" viewBox="0 0 40 54">
        <path fill="#092e6d" fill-rule="evenodd" d="M18 0C10 0 4 6 4 14c0 8 14 21 14 21s14-13 14-21C32 6 26 0 18 0Zm0 8a6 6 0 1 1 0 12 6 6 0 1 1 0-12Z"/>
        <path fill="#378deb" d="M0 33l10-4v19L0 51Zm28-7 12-6v25l-12 4Z"/>
        <path fill="#4da6cc" d="m13 40 12-11v17l-12 7Z"/>
        <path fill="#27afa5" d="M2 52c15 3 24-15 38-13-1 12-14 19-38 13Z"/>
      </svg>
      <span>KotaKita</span>
    </a>

    <button class="city-picker" type="button">
      <svg class="icon"><use href="#icon-pin"/></svg>
      <span>Bandung</span>
    </button>

    <nav class="navigation">
      <a href="dashboard.html">Beranda</a>
      <a href="lokasi.html">Lokasi</a>
      <a class="active" href="uploadLaporan.html">Upload Laporan</a>
      <a href="laporan.html">Laporan</a>
    </nav>

    <div class="header__actions">
      <a class="points" href="Profil-Poin(Semua).html" style="text-decoration:none;color:#FFFFFF;cursor:pointer"><span class="coin">★</span><span>23 Poin</span></a>
      </div>
      <a class="profile" href="Profil.html"><svg class="icon"><use href="#icon-profile"/></svg></a>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="content-container">
    <h1 class="heading">Upload Laporan</h1>

    <!-- Ikon Lingkaran Ceklis Sukses -->
    <svg class="abs success-icon-box" id="ikonSukses" viewBox="0 0 382 382" aria-hidden="true">
      <defs>
        <linearGradient id="checkCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#728db3"/>
          <stop offset="100%" stop-color="#426493"/>
        </linearGradient>
      </defs>
      <circle cx="191" cy="191" r="191" fill="url(#checkCircleGrad)" />
      <path d="M115 190 L168 243 L267 142" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="26" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </svg>

    <p class="abs success-title" id="judulSukses">Laporan Terkirim</p>
    <p class="abs success-code" id="kodeLaporan" hidden></p>
    <p class="abs success-summary" id="ringkasanLaporan" hidden></p>

    <div class="buttons-wrapper">
      <a class="button home-button" href="dashboard.html">Kembali ke Beranda</a>
      <a class="button detail-button" id="btnDetail" href="detailLaporan.html">Detail Laporan</a>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/laporanData.js"></script>
<script src="js/laporanTerkonfirmasi.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const go = (url) => { if (url) window.location.href = url; };
  document.querySelectorAll('form').forEach(form => form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (form.classList.contains('login__form')) { go('dashboard.html'); return; }
    if (form.classList.contains('registration__form')) { go('login.html'); return; }
    if (form.querySelector('input[type="file"]')) { go('detail-after-UploadLaporan.html'); return; }
  }));
  document.querySelectorAll('.issue-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.issue-btn').forEach(x => x.classList.remove('selected')); btn.classList.add('selected');
  }));
  document.querySelectorAll('.filter').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(x => x.classList.remove('active')); btn.classList.add('active');
  }));
  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    const c=btn.className; if(c.includes('vouchers')) go('Profil-Poin(Semua).html#voucher'); else if(c.includes('history')) go('rekamLaporan.html'); else go('Profil-Poin(Semua).html');
  }));
  document.querySelectorAll('.save').forEach(btn => btn.addEventListener('click', () => { alert('Perubahan berhasil disimpan.'); }));
  document.querySelectorAll('.logout').forEach(btn => btn.addEventListener('click', () => go('welcome.html')));
  document.querySelectorAll('.btn-confirm').forEach(btn => btn.addEventListener('click', () => go('detail-after-UploadLaporan.html')));
  document.querySelectorAll('.detail-button.withdraw').forEach(btn => btn.addEventListener('click', () => { if(confirm('Tarik laporan ini?')) go('rekamLaporan.html'); }));
  document.querySelectorAll('.download').forEach(btn => btn.addEventListener('click', () => {
    const blob=new Blob(['Riwayat laporan KotaKita'],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='riwayat-laporan.txt'; a.click(); URL.revokeObjectURL(a.href);
  }));
  document.querySelectorAll('.redeem:not(:disabled)').forEach(btn => btn.addEventListener('click', () => alert('Penukaran poin dipilih. Konfirmasi transaksi memerlukan backend aplikasi.')));
  document.querySelectorAll('.action').forEach(btn => btn.addEventListener('click', () => alert(btn.classList.contains('feedback')?'Terima kasih atas masukan Anda.':'Silakan gunakan kanal kontak resmi KotaKita.')));
  document.querySelectorAll('.city-picker').forEach(btn => btn.addEventListener('click', () => {
    const city=prompt('Masukkan nama kota:', 'Bandung'); if(city&&city.trim()){btn.setAttribute('aria-label','Kota '+city.trim()); const t=Array.from(btn.childNodes).find(n=>n.nodeType===3&&n.textContent.trim()); if(t)t.textContent=' '+city.trim()+' ';}
  }));
  document.querySelectorAll('.avatar-upload').forEach(btn => btn.addEventListener('click', () => {
    let i=document.querySelector('#avatar-file'); if(!i){i=document.createElement('input');i.type='file';i.id='avatar-file';i.accept='image/*';i.hidden=true;document.body.appendChild(i);} i.click();
  }));
  document.querySelectorAll('.location-card__edit-btn').forEach(btn => btn.addEventListener('click', () => go('lokasi.html')));
});
</script>
</body>
</html>
