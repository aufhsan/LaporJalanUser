<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — KotaKita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <style>
    :root {
      --navy: #092e6d;
      --text: #131b2e;
      --muted: #5c5c5c;
      --danger: #ad0000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #d5e1f4 57.2%,
        #a8bfe7 100%
      );
      -webkit-font-smoothing: antialiased;
      zoom: 0.67; /* Disamakan dengan detailLaporan2-5.html */
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .icon {
      display: block;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .svg-definitions {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    /* HEADER NAVBAR GLASSMORPHISM (Sama dengan detailLaporan2-5.html) */
    .header {
      position: fixed;
      top: 15px;
      left: 17px;
      right: 17px;
      z-index: 1000;
      min-height: 96px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.45), rgba(177,201,242,0.3));
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 32px rgba(9,46,109,0.12);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      color: var(--navy);
      font-size: 32px;
      font-weight: 700;
    }

    .city-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 16px;
      border: 1px solid var(--navy);
      border-radius: 58px;
      background: rgba(247, 251, 253, 0.4);
      color: var(--navy);
      font-size: 18px;
      font-weight: 500;
      white-space: nowrap;
    }

    .city-picker .icon-arrow {
      transform: rotate(90deg);
      width: 18px;
      height: 18px;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-left: auto;
    }

    .navigation a {
      position: relative;
      padding: 12px 0;
      color: var(--navy);
      font-size: 20px;
      font-weight: 500;
      white-space: nowrap;
    }

    .navigation a.active {
      font-weight: 600;
    }

    .navigation a.active::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -2px;
      left: 0;
      height: 4px;
      border-radius: 4px;
      background: var(--navy);
    }

    .header__actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-left: 20px;
    }

    .points {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 18px;
      border-radius: 58px;
      background: linear-gradient(135deg, #3280f3, #0c336c);
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .coin {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 2px solid #ffe588;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffdf6d, #ffb300);
      color: #7a4b00;
      font-size: 14px;
      font-weight: 900;
    }
.profile {
      display: grid;
      place-items: center;
      width: 49px;
      height: 49px;
      border-radius: 50%;
      background: #b2d1ff;
      color: var(--navy);
      flex-shrink: 0;
    }

    /* MAIN DASHBOARD CONTENT */
    .dashboard {
      width: min(1508px, calc(100% - 64px));
      margin: 140px auto 32px; /* Top margin disesuaikan agar tidak tertutup header fixed */
    }

    .dashboard__top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 46px;
      align-items: start;
    }

    .section-title {
      margin: 0 0 24px;
      color: var(--navy);
      font-size: 24px;
      font-weight: 600;
      line-height: 1.2;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 58px;
      padding: 0 25px;
      border-radius: 45px;
      background: #ffffff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.17);
    }

    .search .icon {
      width: 21px;
      height: 21px;
      color: #111111;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      font-weight: 500;
    }

    .search input::placeholder {
      color: rgba(0, 0, 0, 0.5);
    }

    .map {
      height: 539px;
      margin-top: 35px;
      overflow: hidden;
      border-radius: 45px;
      background: #ffffff;
      box-shadow: 0 3px 23px rgba(0, 0, 0, 0.15);
    }

    /* Peta Leaflet */
    #map {
      isolation: isolate;          /* z-index internal Leaflet tidak menimpa header fixed */
      font-family: "Inter", Arial, sans-serif;
    }

    .kk-pin { background: none; border: 0; }
    .kk-pin svg { display: block; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35)); }

    .kk-me {
      display: block;
      width: 22px;
      height: 22px;
      border: 3px solid #ffffff;
      border-radius: 50%;
      background: #1c6ef2;
      box-shadow: 0 0 0 0 rgba(28, 110, 242, 0.5), 0 1px 4px rgba(0, 0, 0, 0.4);
      animation: kk-pulse 2s infinite;
    }
    .kk-me--kota { background: #7048e8; animation: none; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4); }
    @keyframes kk-pulse {
      70%  { box-shadow: 0 0 0 14px rgba(28, 110, 242, 0), 0 1px 4px rgba(0, 0, 0, 0.4); }
      100% { box-shadow: 0 0 0 0 rgba(28, 110, 242, 0), 0 1px 4px rgba(0, 0, 0, 0.4); }
    }

    .kk-map-note {
      max-width: 260px;
      margin: 0 0 12px 12px !important;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
      color: var(--text);
      font-size: 12px;
      line-height: 1.4;
    }
    .kk-map-note[hidden] { display: none; }

    .leaflet-popup-content-wrapper { border-radius: 16px; }
    .leaflet-popup-content { margin: 14px 16px; font-family: "Inter", Arial, sans-serif; }
    .kk-pop__title { margin: 0 0 8px; color: var(--navy); font-size: 16px; font-weight: 600; line-height: 1.3; }
    .kk-pop__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .kk-badge { padding: 2px 10px; border-radius: 20px; background: #e9ecef; color: #343a40; font-size: 12px; font-weight: 600; text-transform: capitalize; }
    .kk-badge--ok { background: #d3f9d8; color: #2b8a3e; }
    .kk-badge--aktif { background: #dbe4ff; color: #364fc7; }
    .kk-badge--ringan { background: #fff3bf; color: #8a6d00; }
    .kk-badge--sedang { background: #ffe8cc; color: #d9480f; }
    .kk-badge--parah { background: #ffe3e3; color: #c92a2a; }
    .kk-pop__desc { margin: 0 0 8px; color: var(--text); font-size: 13px; line-height: 1.45; }
    .kk-pop__row { margin: 0 0 4px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .kk-pop__row strong { color: var(--text); }
    .kk-pop__btn { margin-top: 8px; padding: 7px 14px; border: 0; border-radius: 20px; background: var(--navy); color: #ffffff; font-size: 13px; font-weight: 600; }
    .kk-pop__btn:hover { background: #0c3d8f; }

    /* ISU TERDEKAT */
    .issues {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 632px;
      padding: 34px 30px;
      border-radius: 45px;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
    }

    .issue {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 97px;
      padding: 18px 20px 18px 24px;
      overflow: hidden;
      border: 1px solid #e2e2e2;
      border-radius: 25px;
      background: #f7f7f7;
    }

    .issue::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 9px;
      background: var(--danger);
    }

    .issue__title {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 600;
    }

    .issue__location,
    .issue__time {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .issue .icon {
      color: rgba(19, 27, 46, 0.48);
    }

    /* LAPORAN TERBARU */
    .latest {
      margin-top: 39px;
    }

    .reports {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 31px;
    }

    .report {
      position: relative;
      min-height: 269px;
      overflow: hidden;
      border-radius: 35px;
      background: #687482;
      color: #ffffff;
    }

    .report__image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .report::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 35%,
        rgba(0, 0, 0, 0.75) 100%
      );
    }

    .report__content {
      position: absolute;
      z-index: 1;
      right: 24px;
      bottom: 23px;
      left: 24px;
    }

    .report__title {
      margin: 0 0 4px;
      font-size: 24px;
      font-weight: 600;
    }

    .report__description {
      margin: 0;
      font-size: 16px;
    }

    /* RESPONSIVE */
    @media (max-width: 1400px) {
      .navigation {
        gap: 20px;
      }
      .navigation a {
        font-size: 17px;
      }
      .brand {
        font-size: 26px;
      }
      .dashboard__top {
        gap: 24px;
      }
    }

    @media (max-width: 1100px) {
      .header {
        flex-wrap: wrap;
      }

      .navigation {
        order: 3;
        width: 100%;
        justify-content: center;
        margin: 10px 0 0;
      }

      .dashboard__top {
        grid-template-columns: 1fr;
      }

      .map {
        height: 400px;
      }

      .issues {
        min-height: auto;
      }

      .reports {
        grid-template-columns: 1fr;
      }
    }

  body { padding-top: 112px; }

}

    /* Data laporan dari Supabase */

<script>
document.addEventListener('DOMContentLoaded', function () {
  const go = (url) => { if (url) window.location.href = url; };
  document.querySelectorAll('form').forEach(form => form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (form.classList.contains('login__form')) { go('dashboard.html'); return; }
    if (form.classList.contains('registration__form')) { go('login.html'); return; }
    if (form.querySelector('input[type="file"]')) { go('detail-after-UploadLaporan.html'); return; }
  }));
  document.querySelectorAll('.issue-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.issue-btn').forEach(x => x.classList.remove('selected')); btn.classList.add('selected');
  }));
  document.querySelectorAll('.filter').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(x => x.classList.remove('active')); btn.classList.add('active');
  }));
  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    const c=btn.className; if(c.includes('vouchers')) go('Profil-Poin(Semua).html#voucher'); else if(c.includes('history')) go('rekamLaporan.html'); else go('Profil-Poin(Semua).html');
  }));
  document.querySelectorAll('.save').forEach(btn => btn.addEventListener('click', () => { alert('Perubahan berhasil disimpan.'); }));
  document.querySelectorAll('.logout').forEach(btn => btn.addEventListener('click', () => go('welcome.html')));
  document.querySelectorAll('.btn-confirm').forEach(btn => btn.addEventListener('click', () => go('detail-after-UploadLaporan.html')));
  document.querySelectorAll('.detail-button.withdraw').forEach(btn => btn.addEventListener('click', () => { if(confirm('Tarik laporan ini?')) go('rekamLaporan.html'); }));
  document.querySelectorAll('.download').forEach(btn => btn.addEventListener('click', () => {
    const blob=new Blob(['Riwayat laporan KotaKita'],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='riwayat-laporan.txt'; a.click(); URL.revokeObjectURL(a.href);
  }));
  document.querySelectorAll('.redeem:not(:disabled)').forEach(btn => btn.addEventListener('click', () => alert('Penukaran poin dipilih. Konfirmasi transaksi memerlukan backend aplikasi.')));
  document.querySelectorAll('.action').forEach(btn => btn.addEventListener('click', () => alert(btn.classList.contains('feedback')?'Terima kasih atas masukan Anda.':'Silakan gunakan kanal kontak resmi KotaKita.')));
  document.querySelectorAll('.city-picker').forEach(btn => btn.addEventListener('click', () => {
    const city=prompt('Masukkan nama kota:', 'Bandung'); if(city&&city.trim()){btn.setAttribute('aria-label','Kota '+city.trim()); const t=Array.from(btn.childNodes).find(n=>n.nodeType===3&&n.textContent.trim()); if(t)t.textContent=' '+city.trim()+' ';}
  }));
  document.querySelectorAll('.avatar-upload').forEach(btn => btn.addEventListener('click', () => {
    let i=document.querySelector('#avatar-file'); if(!i){i=document.createElement('input');i.type='file';i.id='avatar-file';i.accept='image/*';i.hidden=true;document.body.appendChild(i);} i.click();
  }));
  document.querySelectorAll('.location-card__edit-btn').forEach(btn => btn.addEventListener('click', () => go('lokasi.html')));
});
</script>
<script src="js/poin.js"></script>
</body>
</html>
