<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lokasi — KotaKita</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

  <style>
    :root {
      --navy: #092e6d;
      --navy-light: #5a739d;
      --surface: #f7fbfd;
      --text: #131b2e;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background: linear-gradient(90deg, #fff 0%, #d5e1f4 57.2%, #a8bfe7 100%);
      zoom: 0.67; /* Disamakan dengan detailLaporan.html */
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    button {
      padding: 0;
      border: 0;
      cursor: pointer;
    }

    img, p, h1, h2, h3 {
      margin: 0;
      display: block;
    }

    .icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* Header Navbar Glassmorphism (Sama dengan detailLaporan.html) */
    .header {
      position: fixed;
      top: 15px;
      left: 17px;
      right: 17px;
      z-index: 1000;
      min-height: 96px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.45), rgba(177,201,242,0.3));
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 32px rgba(9,46,109,0.12);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--navy);
      font-size: 32px;
      font-weight: 700;
    }

    .city-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 16px;
      border: 1px solid var(--navy);
      border-radius: 58px;
      background: rgba(247,251,253,0.4);
      color: var(--navy);
      font-size: 18px;
      font-weight: 500;
    }

    .city-picker .icon-arrow {
      transform: rotate(90deg);
      width: 18px;
      height: 18px;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-left: auto;
    }

    .navigation a {
      position: relative;
      padding: 12px 0;
      color: var(--navy);
      font-size: 20px;
      font-weight: 500;
    }

    .navigation a.active {
      font-weight: 600;
    }

    .navigation a.active::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -2px;
      left: 0;
      height: 4px;
      border-radius: 4px;
      background: var(--navy);
    }

    .header__actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-left: 20px;
    }

    .points {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 18px;
      border-radius: 58px;
      background: linear-gradient(135deg, #3280f3, #0c336c);
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
    }

    .coin {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 2px solid #ffe588;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffdf6d, #ffb300);
      color: #7a4b00;
      font-size: 14px;
      font-weight: 900;
    }
.profile {
      display: grid;
      place-items: center;
      width: 49px;
      height: 49px;
      border-radius: 50%;
      background: #b2d1ff;
      color: var(--navy);
    }

    /* Layout Konten Utama */
    .page {
      position: relative;
      width: 1920px;
      height: 1200px;
      margin: 0 auto;
      overflow: hidden;
    }

    .box {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      height: var(--h);
    }

    .text {
      display: flex;
      align-items: center;
      margin: 0;
      font-size: var(--fs, 16px);
      font-weight: var(--fw, 500);
      line-height: 16px;
      letter-spacing: var(--ls, .24px);
      white-space: nowrap;
      color: var(--navy);
    }

    /* Sidebar & Daftar Lokasi */
    .sidebar {
      position: absolute;
      left: 151px;
      top: 240px;
      width: 501px;
      height: 861px;
      overflow: hidden;
      border-radius: 45px;
      background: var(--surface);
      box-shadow: inset 0 0 0 .5px var(--navy), 0 10px 30px rgba(9, 46, 109, 0.05);
    }

    .search {
      position: absolute;
      left: 34px;
      top: 36px;
      width: 433px;
      height: 57px;
      overflow: hidden;
      border-radius: 45px;
      background: var(--surface);
      box-shadow: inset 0 0 0 .5px var(--navy);
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    .search-icon-svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: var(--navy-light);
      stroke-width: 2;
      margin-right: 12px;
    }

    .search-input {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--navy);
      font-size: 16px;
      font-weight: 500;
    }

    .search-input::placeholder {
      color: var(--navy-light);
    }

    .filter-group {
      position: absolute;
      top: 108px;
      left: 34px;
      display: flex;
      gap: 10px;
    }

    .filter {
      height: 34px;
      padding: 0 20px;
      border-radius: 100px;
      background: transparent;
      color: #06306f;
      box-shadow: inset 0 0 0 2px #06306f;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .filter.active {
      background: #06306f;
      color: var(--surface);
      box-shadow: none;
      font-weight: 600;
    }

    .location-list {
      position: absolute;
      left: 34px;
      top: 158px;
      width: 433px;
      height: 660px;
      overflow-y: auto;
      padding-right: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(9, 46, 109, .5) transparent;
    }

    .location-list::-webkit-scrollbar {
      width: 6px;
    }

    .location-list::-webkit-scrollbar-thumb {
      background: rgba(9, 46, 109, .5);
      border-radius: 69px;
    }

    .location-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Item laporan: sama dengan card "Isu Terdekat" di dashboard.html */
    .location-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 16px;
      width: 100%;
      min-height: 97px;
      padding: 18px 20px 18px 24px;
      overflow: hidden;
      border: 1px solid #e2e2e2;
      border-radius: 25px;
      background: #f7f7f7;
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s;
    }

    .location-row:hover,
    .location-row.selected {
      background: #e3ebf8;
    }

    .location-row::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 9px;
      background: var(--bar, #ad0000);
    }

    .row-title {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 600;
    }

    .row-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .row-address,
    .row-time {
      margin: 0;
      color: #5c5c5c;
      font-size: 14px;
    }

    .location-row .icon {
      color: rgba(19, 27, 46, 0.48);
    }

    /* Peta Interaktif */
    .map-frame {
      position: absolute;
      left: 678px;
      top: 240px;
      width: 1091px;
      height: 861px;
      overflow: hidden;
      isolation: isolate;
      border-radius: 45px;
      background: #f7fbfd;
      color: #092e6d;
      box-shadow: 0 10px 30px rgba(9, 46, 109, 0.08);
    }

    .map-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 10;
      border: 0.5px solid #092e6d;
      border-radius: inherit;
      pointer-events: none;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 0;
      isolation: isolate;
      background: #e8eef7;
      font-family: "Inter", sans-serif;
    }

    .pin {
      width: 40px;
      height: 50px;
      filter: drop-shadow(0 4px 6px rgba(9, 46, 109, 0.35));
      transition: transform .2s;
      transform-origin: 50% 100%;
    }
    .pin svg { width: 100%; height: 100%; display: block; fill: #378deb; }
    .pin.sel svg { fill: #092e6d; }
    .pin.sel { transform: scale(1.3); animation: bounce 2s infinite ease-in-out; }

    @keyframes bounce {
      0%, 100% { transform: scale(1.3) translateY(0); }
      50% { transform: scale(1.3) translateY(-8px); }
    }

    .map-msg {
      position: absolute;
      top: 20px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 10px 20px;
      border-radius: 99px;
      background: #fff;
      color: var(--navy);
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(9,46,109,.18);
    }

    .radius-info {
      position: absolute;
      top: 20px; right: 20px;
      z-index: 1000;
      max-width: 340px;
      padding: 10px 16px;
      border-radius: 18px;
      background: #fff;
      color: var(--navy);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      box-shadow: 0 6px 20px rgba(9,46,109,.18);
    }
    .radius-info small { display: block; font-weight: 500; color: var(--navy-light); }
    .radius-info a { color: #3a6dc2; text-decoration: underline; }

    .list-msg {
      padding: 24px 8px;
      color: var(--navy-light);
      font-size: 16px;
      text-align: center;
    }

    .report-card {
      position: absolute;
      left: 25px;
      top: 562px;
      width: 287px;
      height: 274px;
      margin: 0;
      overflow: hidden;
      border-radius: 31px;
      background: rgb(240, 250, 255);
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(9, 46, 109, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .report-card[hidden] { display: none; }

    .row-chevron { display: grid; place-items: center; }

    .report-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(9, 46, 109, 0.18);
    }

    .report-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      border: 0.5px solid #092e6d;
      border-radius: inherit;
      pointer-events: none;
    }

    .photo-placeholder {
      background-size: cover !important;
      background-position: center !important;
      position: absolute;
      left: 14px;
      top: 16px;
      width: 260px;
      height: 141px;
      overflow: hidden;
      border-radius: 19px;
      background: rgb(152, 189, 208);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-label {
      font-size: 13px;
      font-weight: 600;
      color: #092e6d;
      letter-spacing: 0.24px;
      white-space: nowrap;
      opacity: 0.85;
    }

    .report-title {
      position: absolute;
      left: 23px;
      top: 170px;
      width: 240px;
      height: 22px;
      margin: 0;
      display: flex;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      line-height: 16px;
      letter-spacing: 0.24px;
      color: #092e6d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .report-description {
      position: absolute;
      left: 23px;
      top: 196px;
      width: 240px;
      height: 32px;
      margin: 0;
      color: rgb(90, 115, 157);
      font-size: 13px;
      font-weight: 400;
      line-height: 16px;
      letter-spacing: -0.2px;
    }

    .report-status {
      position: absolute;
      left: 23px;
      top: 237px;
      min-width: 74px;
      padding: 0 12px;
      height: 22px;
      overflow: hidden;
      border-radius: 47px;
      background: #ffd9a8;
      color: #7a4000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-label {
      font-size: 12px;
      font-weight: 600;
      line-height: 16px;
      letter-spacing: 0.24px;
      white-space: nowrap;
    }

    .report-detail {
      position: absolute;
      left: 180px;
      top: 240px;
      width: 90px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: #092e6d;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.24px;
      text-align: right;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .report-detail:hover {
      text-decoration: underline;
      color: #3a6dc2;
    }
  

/* Responsive mobile layout — desktop styles remain unchanged */

}
@media (max-width: 420px) {
  .header { padding: 8px 9px !important; column-gap: 5px !important; }
  .header > .brand { gap: 3px !important; font-size: 16px !important; }
  .header > .city-picker { padding: 0 7px !important; }
  .header .points { padding: 0 7px !important; }
  .header > .navigation { gap: 7px !important; }

}

<body>
  <!-- SVG Symbols untuk Icon Navbar -->
  <svg style="display:none">
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a8 8 0 0 0-8 8c0 6 8 12 8 12s8-6 8-12a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></symbol>
    <symbol id="icon-profile" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z" fill="currentColor"/></symbol>
  </svg>

  <!-- Navbar Glassmorphism (Sama seperti detailLaporan.html) -->
  <header class="header">
    <a class="brand" href="welcome.html">
      <svg width="37" height="50" viewBox="0 0 40 54">
        <path fill="#092e6d" fill-rule="evenodd" d="M18 0C10 0 4 6 4 14c0 8 14 21 14 21s14-13 14-21C32 6 26 0 18 0Zm0 8a6 6 0 1 1 0 12 6 6 0 1 1 0-12Z"/>
        <path fill="#378deb" d="M0 33l10-4v19L0 51Zm28-7 12-6v25l-12 4Z"/>
        <path fill="#4da6cc" d="m13 40 12-11v17l-12 7Z"/>
        <path fill="#27afa5" d="M2 52c15 3 24-15 38-13-1 12-14 19-38 13Z"/>
      </svg>
      <span>KotaKita</span>
    </a>

    <button class="city-picker" type="button">
      <svg class="icon"><use href="#icon-pin"/></svg>
      <span>Bandung</span>
    </button>

    <nav class="navigation">
      <a href="dashboard.html">Beranda</a>
      <a class="active" href="lokasi.html" aria-current="page">Lokasi</a>
      <a href="uploadLaporan.html">Upload Laporan</a>
      <a href="laporan.html">Laporan</a>
    </nav>

    <div class="header__actions">
      <a class="points" href="Profil-Poin(Semua).html" style="text-decoration:none;color:#FFFFFF;cursor:pointer"><span class="coin">★</span><span>0 Poin</span></a>
      </div>
      <a class="profile" href="Profil.html"><svg class="icon"><use href="#icon-profile"/></svg></a>
    </div>
  </header>

  <main class="page">
    <!-- Judul Halaman -->
    <h1 class="box text" style="--x:151px;--y:179px;--w:427px;--h:16px;--fs:32px;--fw:700">
      Lokasi
    </h1>

    <!-- Sidebar & Search -->
    <aside class="sidebar" aria-label="Daftar lokasi laporan">
      <div class="search">
        <svg class="search-icon-svg" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Cari Lokasi / Laporan"
          aria-label="Cari Lokasi atau Laporan">
      </div>

      <div class="filter-group">
        <button class="filter active" type="button" data-filter="all">Semua</button>
        <button class="filter" type="button" data-filter="nearest">Terdekat</button>
        <button class="filter" type="button" data-filter="latest">Terbaru</button>
      </div>

      <div class="location-list" id="locationList">
        <p class="list-msg">Memuat laporan…</p>
      </div>
    </aside>

    <!-- Frame Peta Interaktif -->
    <section class="map-frame" aria-label="Peta lokasi laporan">
      <div id="map"></div>

      <article class="report-card" id="reportCard" aria-labelledby="cardReportTitle" hidden>
        <div class="photo-placeholder" id="cardPhoto">
          <span class="photo-label" id="cardPhotoLabel">Foto Laporan</span>
        </div>

        <h2 class="report-title" id="cardReportTitle"></h2>

        <p class="report-description">
          <span id="cardReportDesc"></span><br>
          <span id="cardReportTime"></span>
        </p>

        <div class="report-status" id="cardStatus">
          <span class="status-label" id="cardStatusLabel"></span>
        </div>

        <a href="detailLaporan.html" class="report-detail" id="cardDetail">Lihat Detail</a>
      </article>
    </section>
  </main>

  

<script>
document.addEventListener('DOMContentLoaded', function () {
  const go = (url) => { if (url) window.location.href = url; };
  document.querySelectorAll('form').forEach(form => form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (form.classList.contains('login__form')) { go('dashboard.html'); return; }
    if (form.classList.contains('registration__form')) { go('login.html'); return; }
    if (form.querySelector('input[type="file"]')) { go('detail-after-UploadLaporan.html'); return; }
  }));
  document.querySelectorAll('.issue-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.issue-btn').forEach(x => x.classList.remove('selected')); btn.classList.add('selected');
  }));
  document.querySelectorAll('.filter').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(x => x.classList.remove('active')); btn.classList.add('active');
  }));
  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    const c=btn.className; if(c.includes('vouchers')) go('Profil-Poin(Semua).html#voucher'); else if(c.includes('history')) go('rekamLaporan.html'); else go('Profil-Poin(Semua).html');
  }));
  document.querySelectorAll('.save').forEach(btn => btn.addEventListener('click', () => { alert('Perubahan berhasil disimpan.'); }));
  document.querySelectorAll('.logout').forEach(btn => btn.addEventListener('click', () => go('welcome.html')));
  document.querySelectorAll('.btn-confirm').forEach(btn => btn.addEventListener('click', () => go('detail-after-UploadLaporan.html')));
  document.querySelectorAll('.detail-button.withdraw').forEach(btn => btn.addEventListener('click', () => { if(confirm('Tarik laporan ini?')) go('rekamLaporan.html'); }));
  document.querySelectorAll('.download').forEach(btn => btn.addEventListener('click', () => {
    const blob=new Blob(['Riwayat laporan KotaKita'],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='riwayat-laporan.txt'; a.click(); URL.revokeObjectURL(a.href);
  }));
  document.querySelectorAll('.redeem:not(:disabled)').forEach(btn => btn.addEventListener('click', () => alert('Penukaran poin dipilih. Konfirmasi transaksi memerlukan backend aplikasi.')));
  document.querySelectorAll('.action').forEach(btn => btn.addEventListener('click', () => alert(btn.classList.contains('feedback')?'Terima kasih atas masukan Anda.':'Silakan gunakan kanal kontak resmi KotaKita.')));
  document.querySelectorAll('.city-picker').forEach(btn => btn.addEventListener('click', () => {
    const city=prompt('Masukkan nama kota:', 'Bandung'); if(city&&city.trim()){btn.setAttribute('aria-label','Kota '+city.trim()); const t=Array.from(btn.childNodes).find(n=>n.nodeType===3&&n.textContent.trim()); if(t)t.textContent=' '+city.trim()+' ';}
  }));
  document.querySelectorAll('.avatar-upload').forEach(btn => btn.addEventListener('click', () => {
    let i=document.querySelector('#avatar-file'); if(!i){i=document.createElement('input');i.type='file';i.id='avatar-file';i.accept='image/*';i.hidden=true;document.body.appendChild(i);} i.click();
  }));
  document.querySelectorAll('.location-card__edit-btn').forEach(btn => btn.addEventListener('click', () => go('lokasi.html')));
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/laporanData.js"></script>
<script src="js/lokasiKota.js"></script>
<script src="js/radiusLokasi.js"></script>
<script>
/* Memakai helper yang sama dengan halaman lain: window.db (supabaseClient.js) & window.KKL (laporanData.js) */
const K = window.KKL;
const DEFAULT_CENTER = [-6.9175, 107.6191]; // Bandung

const WARNA = {
  sent:       { bg: '#dbe7fb', fg: '#092e6d', bar: '#378deb' },
  verified:   { bg: '#e3f1ff', fg: '#0b4a8a', bar: '#4da6cc' },
  processing: { bg: '#ffd9a8', fg: '#7a4000', bar: '#e08a00' },
  completed:  { bg: '#c9f0d4', fg: '#0b5a2a', bar: '#1f9d55' },
  rejected:   { bg: '#ffe0e0', fg: '#8a0000', bar: '#ad0000' }
};
const PIN_SVG = '<svg viewBox="0 0 63.33 79.21"><path fill-rule="nonzero" d="M31.67 0C14.21 0 0 14.21 0 31.67c-.12 25.49 28.18 45.91 29.37 46.79a3.1 3.1 0 0 0 4.6 0c1.19-.87 29.49-21.26 29.37-46.79C63.33 14.21 49.12 0 31.67 0Zm0 47.5a15.83 15.83 0 1 1 0-31.67 15.83 15.83 0 0 1 0 31.67Z"/></svg>';

const $ = (id) => document.getElementById(id);
const listEl = $('locationList');
const cardEl = $('reportCard');

let reports = [];
let selectedId = null;
let activeFilter = 'all';
let query = '';
let userPos = null;      // posisi pengguna untuk jarak di daftar ('Terdekat')
let pusat = null;        // titik pusat radius
let pusatAkurat = false;
let radiusKm = 4;
let lingkaran = null;
const markers = new Map();

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function timeAgo(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!Number.isFinite(s)) return '';
  if (s < 60) return 'Baru saja';
  const m = Math.floor(s / 60); if (m < 60) return `${m} Menit yang lalu`;
  const h = Math.floor(m / 60); if (h < 24) return `${h} Jam yang lalu`;
  const d = Math.floor(h / 24); if (d < 30) return `${d} Hari yang lalu`;
  return K.tanggal(iso);
}

function distKm(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const fmtDist = (km) => km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`;

function decorate(n, i) {
  const alamat = [n.alamat.utama, K.segmen1(n.alamat.rinci)].filter(Boolean).join(', ');
  return Object.assign(n, {
    id: n.kode || `row-${i}`,
    title: n.kategori + (n.tingkat ? ` (${K.huruf1(n.tingkat)})` : ''),
    addr: alamat,
    hasPos: K.koordinatOk(n.lat, n.lng),
    warna: WARNA[n.st.key] || WARNA.sent,
    dist: null
  });
}
function hitungJarak() {
  const asal = userPos || (pusatAkurat ? pusat : null);
  reports.forEach((r) => { r.dist = (asal && r.hasPos) ? distKm(asal, [r.lat, r.lng]) : null; });
}

/* ---------- Radius lokasi laporan ---------- */
function terapkanRadius() {
  reports.forEach((r) => {
    r.dalamRadius = (pusat && r.hasPos) ? KKR.dalamRadius(pusat, [r.lat, r.lng], radiusKm) : false;
  });
  if (!lingkaran) lingkaran = KKR.gambarLingkaran(map, pusat, radiusKm);
  else lingkaran.update(pusat, radiusKm);
  hitungJarak();
}

function infoRadius() {
  let el = document.querySelector('.radius-info');
  if (!el) { el = document.createElement('div'); el.className = 'radius-info'; document.querySelector('.map-frame').appendChild(el); }
  const jml = reports.filter((r) => r.dalamRadius).length;
  el.innerHTML = `Radius ${radiusKm} km • ${jml} laporan`
    + `<small>${pusatAkurat ? 'dari lokasi Anda' : 'dari pusat kota (izin lokasi tidak aktif)'} • <a href="Profil-Akun.html">Ubah</a></small>`;
}

/* ---------- Peta ---------- */
const map = L.map('map').setView(DEFAULT_CENTER, 13);
// Tile utama: OpenStreetMap. Jika diblokir (mis. dibuka lewat file://), otomatis pindah ke Esri.
const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
});
const esriLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri'
});
let tileFallback = false;
function useEsri() {
  if (tileFallback) return;
  tileFallback = true;
  map.removeLayer(osmLayer);
  esriLayer.addTo(map);
}
if (location.protocol === 'file:') { esriLayer.addTo(map); tileFallback = true; }
else {
  let galat = 0;
  osmLayer.on('tileerror', () => { if (++galat >= 3) useEsri(); });
  osmLayer.addTo(map);
}
const markerLayer = L.layerGroup().addTo(map);

const pinIcon = (sel) => L.divIcon({
  className: '',
  html: `<div class="pin${sel ? ' sel' : ''}">${PIN_SVG}</div>`,
  iconSize: [40, 50], iconAnchor: [20, 50]
});

function mapMsg(text) {
  let el = document.querySelector('.map-msg');
  if (!text) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.className = 'map-msg'; document.querySelector('.map-frame').appendChild(el); }
  el.textContent = text;
}

/* ---------- Filter / cari / urut ---------- */
function visibleReports() {
  const q = query.trim().toLowerCase();
  let out = reports.filter((r) => r.dalamRadius !== false)
    .filter((r) => !q || r.title.toLowerCase().includes(q) || r.addr.toLowerCase().includes(q) || r.kode.toLowerCase().includes(q));
  if (activeFilter === 'nearest') out = out.filter((r) => r.dist != null).sort((a, b) => a.dist - b.dist);
  else out = out.sort(K.terbaruDulu);
  return out;
}

function render() {
  const data = visibleReports();

  if (!data.length) {
    listEl.innerHTML = `<p class="list-msg">${reports.length ? 'Tidak ada laporan yang cocok.' : 'Belum ada laporan.'}</p>`;
  } else {
    listEl.innerHTML = data.map((r) => {
      const dist = r.dist != null ? ` • ${fmtDist(r.dist)}` : '';
      return `
      <div class="location-row${r.id === selectedId ? ' selected' : ''}" data-id="${esc(r.id)}" style="--bar:${r.warna.bar}">
        <div>
          <h3 class="row-title">${esc(r.title)}</h3>
          <p class="row-address">${esc(r.addr)}${dist}</p>
          <p class="row-time">${esc(timeAgo(r.dibuat))}${r.dibuat ? ' dilaporkan' : ''}</p>
        </div>
        <a class="row-chevron" href="${esc(K.linkDetail(r.kode))}" aria-label="Lihat detail laporan">
          <svg class="icon" aria-hidden="true"><use href="#icon-chevron"/></svg>
        </a>
      </div>`;
    }).join('');
  }

  markerLayer.clearLayers();
  markers.clear();
  data.filter((r) => r.hasPos).forEach((r) => {
    const m = L.marker([r.lat, r.lng], { icon: pinIcon(r.id === selectedId), title: r.title })
      .on('click', () => select(r.id, { scroll: true }));
    m.addTo(markerLayer);
    markers.set(r.id, m);
  });

  if (data.length && !data.some((r) => r.id === selectedId)) select(data[0].id, { pan: false });
  else if (!data.length) { selectedId = null; cardEl.hidden = true; }
}

/* ---------- Pilih laporan ---------- */
function select(id, opts = {}) {
  const r = reports.find((x) => x.id === id);
  if (!r) return;
  selectedId = id;

  listEl.querySelectorAll('.location-row').forEach((row) => {
    const on = row.dataset.id === String(id);
    row.classList.toggle('selected', on);
    if (on && opts.scroll) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
  markers.forEach((m, mid) => m.setIcon(pinIcon(mid === id)));
  if (markers.has(id)) markers.get(id).setZIndexOffset(1000);

  cardEl.hidden = false;
  $('cardReportTitle').textContent = r.title;
  $('cardReportDesc').textContent = r.addr || '-';
  $('cardReportTime').textContent = timeAgo(r.dibuat);
  const st = $('cardStatus');
  st.style.background = r.warna.bg;
  st.style.color = r.warna.fg;
  $('cardStatusLabel').textContent = r.st.label;
  $('cardPhoto').style.backgroundImage = r.foto ? `url("${r.foto.replace(/"/g, '%22')}")` : '';
  $('cardPhotoLabel').style.display = r.foto ? 'none' : '';
  $('cardDetail').href = K.linkDetail(r.kode);

  if (opts.pan !== false && r.hasPos) map.flyTo([r.lat, r.lng], Math.max(map.getZoom(), 16), { duration: 0.6 });
}

/* ---------- Event UI ---------- */
listEl.addEventListener('click', (e) => {
  if (e.target.closest('.row-chevron')) return;       // panah → ke halaman detail
  const row = e.target.closest('.location-row');
  if (row) select(row.dataset.id);
});

$('searchInput').addEventListener('input', (e) => { query = e.target.value; render(); });

document.querySelectorAll('.filter').forEach((btn) => {
  btn.addEventListener('click', async () => {
    activeFilter = btn.dataset.filter;
    if (activeFilter === 'nearest' && !userPos) await locate();
    render(); fitToVisible();
  });
});

cardEl.addEventListener('click', (e) => {
  if (e.target.closest('a')) return;
  const r = reports.find((x) => x.id === selectedId);
  if (r && r.kode) window.location.href = K.linkDetail(r.kode);
});

function fitToVisible() {
  if (lingkaran) map.fitBounds(lingkaran.lingkaran.getBounds(), { padding: [30, 30] });
  else map.setView(pusat || DEFAULT_CENTER, 13);
}

function locate() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve();
    navigator.geolocation.getCurrentPosition(
      (pos) => { userPos = [pos.coords.latitude, pos.coords.longitude]; hitungJarak(); resolve(); },
      () => { mapMsg('Izin lokasi ditolak — "Terdekat" tidak tersedia'); setTimeout(() => mapMsg(''), 3500); resolve(); },
      { timeout: 8000 }
    );
  });
}

/* ---------- Muat data ---------- */
(async function init() {
  if (!K || !window.db || !window.KK) {
    listEl.innerHTML = '<p class="list-msg">Supabase belum dimuat. Periksa tag &lt;script&gt; (js/supabaseClient.js & js/laporanData.js).</p>';
    return;
  }
  const sesi = await K.pastikanLogin();
  if (!sesi) return;
  K.buka();

  // radius dari profil + posisi pengguna (paralel dengan data laporan)
  const [rk, lokasi] = await Promise.all([KKR.muatRadius(sesi.user.id), KKR.posisiPengguna()]);
  radiusKm = rk;
  pusat = lokasi.pos;
  pusatAkurat = lokasi.akurat;
  if (pusatAkurat) userPos = pusat;

  try {
    reports = (await K.ambilPublik(300, sesi.user.id)).map(decorate);
  } catch (err) {
    console.error('[lokasi]', err);
    listEl.innerHTML = `<p class="list-msg">${esc(K.pesanGalat(err))}</p>`;
    return;
  }
  terapkanRadius();
  infoRadius();
  render();
  fitToVisible();

  const wanted = new URLSearchParams(location.search).get('kode');
  if (wanted) {
    const w = reports.find((r) => r.id === wanted);
    if (w && !w.dalamRadius) { w.dalamRadius = true; render(); }   // laporan yang dibuka lewat link tetap ditampilkan
    if (w) select(wanted, { scroll: true });
  }
})();

</script><script src="js/poin.js"></script>
