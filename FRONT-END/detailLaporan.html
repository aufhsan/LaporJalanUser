<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Laporan — KotaKita</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #092e6d;
      --text: #131b2e;
      --surface: #f7fbfd;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background: linear-gradient(90deg, #fff 0%, #d5e1f4 57.2%, #a8bfe7 100%);
      zoom: 0.67; /* Disamakan dengan detailUoploadLaporan2-5.html */
      -webkit-font-smoothing: antialiased;
    }

    button, a {
      font: inherit;
      color: inherit;
    }

    button {
      padding: 0;
      border: 0;
      cursor: pointer;
    }

    a {
      text-decoration: none;
    }

    img, p, h1, h2 {
      margin: 0;
      display: block;
    }

    .icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* Header Navbar Glassmorphism (Sama dengan detailUoploadLaporan2-5.html) */
    .header {
      position: fixed;
      top: 15px;
      left: 17px;
      right: 17px;
      z-index: 1000;
      min-height: 96px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.45), rgba(177,201,242,0.3));
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 32px rgba(9,46,109,0.12);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--navy);
      font-size: 32px;
      font-weight: 700;
    }

    .city-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 16px;
      border: 1px solid var(--navy);
      border-radius: 58px;
      background: rgba(247,251,253,0.4);
      color: var(--navy);
      font-size: 18px;
      font-weight: 500;
    }

    .city-picker .icon-arrow {
      transform: rotate(90deg);
      width: 18px;
      height: 18px;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-left: auto;
    }

    .navigation a {
      position: relative;
      padding: 12px 0;
      color: var(--navy);
      font-size: 20px;
      font-weight: 500;
    }

    .navigation a.active {
      font-weight: 600;
    }

    .navigation a.active::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -2px;
      left: 0;
      height: 4px;
      border-radius: 4px;
      background: var(--navy);
    }

    .header__actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-left: 20px;
    }

    .points {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 18px;
      border-radius: 58px;
      background: linear-gradient(135deg, #3280f3, #0c336c);
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
    }

    .coin {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 2px solid #ffe588;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffdf6d, #ffb300);
      color: #7a4b00;
      font-size: 14px;
      font-weight: 900;
    }
.profile {
      display: grid;
      place-items: center;
      width: 49px;
      height: 49px;
      border-radius: 50%;
      background: #b2d1ff;
      color: var(--navy);
    }

    /* Layout Konten Utama */
    .page {
      position: relative;
      width: 1920px;
      height: 1580px;
      margin: 0 auto;
    }

    .box {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      height: var(--h);
    }

    .text {
      display: flex;
      align-items: center;
      margin: 0;
      font-size: var(--size, 24px);
      font-weight: var(--weight, 600);
      line-height: 16px;
      letter-spacing: var(--spacing, 0.24px);
      white-space: nowrap;
      color: var(--navy);
    }

    .photo {
      position: absolute;
      left: 181px;
      top: 275px;
      width: 754px;
      height: 544px;
      overflow: hidden;
      border: 0.25px solid #001645;
      border-radius: 45px;
      background: var(--surface);
    }

    .photo-image {
      position: absolute;
      left: -31px;
      top: 0;
      width: 816px;
      height: 544px;
      max-width: none;
      object-fit: cover;
    }

    .photo-overlay {
      position: absolute;
      left: 0;
      top: 417px;
      width: 754px;
      height: 127px;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.85),
        rgba(102, 102, 102, 0)
      );
    }

    .photo-caption {
      position: absolute;
      left: 30px;
      top: 75px;
      width: 428px;
      height: 22px;
      display: flex;
      align-items: center;
      color: var(--surface);
      font-size: 16px;
      font-weight: 600;
      line-height: 16px;
      letter-spacing: -1px;
    }

    .photo-date {
      position: absolute;
      left: 297px;
      top: 73px;
      width: 428px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: var(--surface);
      font-size: 16px;
      font-weight: 600;
      line-height: 16px;
      letter-spacing: -1px;
    }

    .photo-dot {
      position: absolute;
      top: 81px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #eef3fa;
      opacity: 0.5;
    }

    .photo-dot.selected {
      left: 351.5px;
      top: 80px;
      width: 12px;
      height: 12px;
      opacity: 1;
    }

    .process-badge {
      position: absolute;
      left: 812px;
      top: 306px;
      width: 94px;
      height: 29px;
      border-radius: 47px;
      background: #ffd9a8;
      color: #7a4000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      line-height: 16px;
      letter-spacing: 0.24px;
    }

    .location-card {
      position: absolute;
      left: 996px;
      top: 275px;
      width: 743px;
      height: 544px;
      overflow: hidden;
      border: 0.5px solid var(--navy);
      border-radius: 45px;
      background: var(--surface);
    }

    .map {
      position: absolute;
      left: 0;
      top: 0;
      width: 743px;
      height: 429px;
      border-radius: 45px 45px 0 0;
      object-fit: cover;
    }

    .location-pin,
    .card-icon {
      color: #092E6D;
    }

    .location-pin {
      position: absolute;
      left: 27px;
      top: 462px;
      width: 40px;
      height: 40px;
    }

    .card {
      position: absolute;
      background: var(--surface);
      border: 0.5px solid var(--navy);
    }

    .reporters-card {
      left: 181px;
      top: 878px;
      width: 742px;
      height: 96px;
      border-radius: 35px;
    }

    .issue-card {
      left: 996px;
      top: 878px;
      width: 742px;
      height: 96px;
      border-radius: 35px;
    }

    .reporters-card .card-icon {
      position: absolute;
      left: 40px;
      top: 28px;
      width: 37px;
      height: 37px;
    }

    .issue-card .card-icon {
      position: absolute;
      left: 40px;
      top: 31px;
      width: 34px;
      height: 34px;
    }

    .status-card {
      left: 181px;
      top: 1037px;
      width: 754px;
      height: 392px;
      border-radius: 45px;
    }

    .status-line {
      position: absolute;
      left: 57px;
      top: 64px;
      height: 250px;
      border-left: 2px dotted rgba(9, 46, 109, 0.25);
    }

    .status-dot {
      position: absolute;
      left: 45px;
      width: 26px;
      height: 27px;
      border-radius: 50%;
      background: var(--navy);
    }

    .status-dot.faded {
      opacity: 0.5;
    }

    .status-dot.pending {
      top: 301px;
      border: 2.5px solid var(--navy);
      background: var(--surface);
    }

    .status-title,
    .status-time {
      position: absolute;
      left: 83px;
      height: 22px;
      margin: 0;
      display: flex;
      align-items: center;
      font-size: 24px;
      line-height: 16px;
      white-space: nowrap;
    }

    .status-title {
      width: 359px;
      font-weight: 600;
      letter-spacing: 0.24px;
    }

    .status-time {
      width: 466px;
      font-weight: 400;
      letter-spacing: -1px;
    }

    .muted {
      opacity: 0.5;
    }

    .detail-card {
      left: 996px;
      top: 1037px;
      width: 742px;
      height: 392px;
      border-radius: 45px;
    }

    .detail-card .card-icon {
      position: absolute;
      left: 37px;
      top: 25px;
      width: 40px;
      height: 40px;
    }

    .detail-description {
      position: absolute;
      left: 97px;
      top: 25px;
      width: 588px;
      height: 104px;
      margin: 0;
      font-size: 24px;
      font-weight: 400;
      line-height: 29px;
    }

    .back-button {
      position: absolute;
      left: 181px;
      top: 1461px;
      width: 1557px;
      height: 88px;
      border-radius: 30px;
      background: var(--navy);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
    }
  

/* Responsive mobile layout — desktop styles remain unchanged */

  .header {

    height: auto !important;
    padding: 10px 12px !important;

  .header > .header__actions { display: contents !important; }
  .header .points { order: 3 !important; flex: 0 0 auto !important; height: 34px !important; padding: 0 9px !important; gap: 5px !important; font-size: 12px !important; white-space: nowrap; }
  .header .points .coin { width: 17px !important; height: 17px !important; font-size: 10px !important; }
  .header > .profile { order: 4 !important; display: inline-flex !important; flex: 0 0 34px !important; width: 34px !important; height: 34px !important; align-items: center !important; justify-content: center !important; margin: 0 !important; }
  .header > .profile .icon { width: 22px !important; height: 22px !important; }
  .header > .navigation { order: 5 !important; flex: 0 0 100% !important; width: 100% !important; min-width: 0 !important; margin: 0 !important; padding: 2px 0 0 !important; display: flex !important; flex-flow: row nowrap !important; align-items: center !important; justify-content: space-between !important; gap: clamp(6px, 2.5vw, 14px) !important; overflow-x: auto !important; scrollbar-width: none; }

  .header > .navigation a.active::after { height: 2px !important; bottom: 0 !important; }
  body { padding-top: 112px; }
  img, video, iframe, canvas, svg { max-width: 100%; }
  main, .main-content, .main-content, .content, .page-content, .container, .wrapper, .dashboard-content, .content-wrapper {
    max-width: 100% !important;
  }
  main, .main-content, .content, .page-content, .dashboard-content, .content-wrapper { width: auto; }

  input, select, textarea { max-width: 100%; }
  table { display: block; max-width: 100%; overflow-x: auto; }
}
@media (max-width: 420px) {
  .header { padding: 8px 9px !important; column-gap: 5px !important; }
  .header > .brand { gap: 3px !important; font-size: 16px !important; }
  .header > .city-picker { padding: 0 7px !important; }
  .header .points { padding: 0 7px !important; }
  .header > .navigation { gap: 7px !important; }
  .header > .navigation a { font-size: 10px !important; }
}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/laporanData.js"></script>
<script src="js/detailLaporan.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const go = (url) => { if (url) window.location.href = url; };
  document.querySelectorAll('form').forEach(form => form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (form.classList.contains('login__form')) { go('dashboard.html'); return; }
    if (form.classList.contains('registration__form')) { go('login.html'); return; }
    if (form.querySelector('input[type="file"]')) { go('detail-after-UploadLaporan.html'); return; }
  }));
  document.querySelectorAll('.issue-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.issue-btn').forEach(x => x.classList.remove('selected')); btn.classList.add('selected');
  }));
  document.querySelectorAll('.filter').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(x => x.classList.remove('active')); btn.classList.add('active');
  }));
  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    const c=btn.className; if(c.includes('vouchers')) go('Profil-Poin(Semua).html#voucher'); else if(c.includes('history')) go('rekamLaporan.html'); else go('Profil-Poin(Semua).html');
  }));
  document.querySelectorAll('.save').forEach(btn => btn.addEventListener('click', () => { alert('Perubahan berhasil disimpan.'); }));
  document.querySelectorAll('.logout').forEach(btn => btn.addEventListener('click', () => go('welcome.html')));
  document.querySelectorAll('.btn-confirm').forEach(btn => btn.addEventListener('click', () => go('detail-after-UploadLaporan.html')));
  document.querySelectorAll('.detail-button.withdraw').forEach(btn => btn.addEventListener('click', () => { if(confirm('Tarik laporan ini?')) go('rekamLaporan.html'); }));
  document.querySelectorAll('.download').forEach(btn => btn.addEventListener('click', () => {
    const blob=new Blob(['Riwayat laporan KotaKita'],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='riwayat-laporan.txt'; a.click(); URL.revokeObjectURL(a.href);
  }));
  document.querySelectorAll('.redeem:not(:disabled)').forEach(btn => btn.addEventListener('click', () => alert('Penukaran poin dipilih. Konfirmasi transaksi memerlukan backend aplikasi.')));
  document.querySelectorAll('.action').forEach(btn => btn.addEventListener('click', () => alert(btn.classList.contains('feedback')?'Terima kasih atas masukan Anda.':'Silakan gunakan kanal kontak resmi KotaKita.')));
  document.querySelectorAll('.city-picker').forEach(btn => btn.addEventListener('click', () => {
    const city=prompt('Masukkan nama kota:', 'Bandung'); if(city&&city.trim()){btn.setAttribute('aria-label','Kota '+city.trim()); const t=Array.from(btn.childNodes).find(n=>n.nodeType===3&&n.textContent.trim()); if(t)t.textContent=' '+city.trim()+' ';}
  }));
  document.querySelectorAll('.avatar-upload').forEach(btn => btn.addEventListener('click', () => {
    let i=document.querySelector('#avatar-file'); if(!i){i=document.createElement('input');i.type='file';i.id='avatar-file';i.accept='image/*';i.hidden=true;document.body.appendChild(i);} i.click();
  }));
  document.querySelectorAll('.location-card__edit-btn').forEach(btn => btn.addEventListener('click', () => go('lokasi.html')));
});
</script>
<script src="js/poin.js"></script>
</body>
