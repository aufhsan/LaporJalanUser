<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — KotaKita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <style>
    :root {
      --navy: #092e6d;
      --text: #131b2e;
      --muted: #5c5c5c;
      --danger: #ad0000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #d5e1f4 57.2%,
        #a8bfe7 100%
      );
      -webkit-font-smoothing: antialiased;
      zoom: 0.67; /* Disamakan dengan detailLaporan2-5.html */
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .icon {
      display: block;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .svg-definitions {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    /* HEADER NAVBAR GLASSMORPHISM (Sama dengan detailLaporan2-5.html) */
    .header {
      position: fixed;
      top: 15px;
      left: 17px;
      right: 17px;
      z-index: 1000;
      min-height: 96px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.45), rgba(177,201,242,0.3));
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 32px rgba(9,46,109,0.12);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      color: var(--navy);
      font-size: 32px;
      font-weight: 700;
    }

    .city-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 16px;
      border: 1px solid var(--navy);
      border-radius: 58px;
      background: rgba(247, 251, 253, 0.4);
      color: var(--navy);
      font-size: 18px;
      font-weight: 500;
      white-space: nowrap;
    }

    .city-picker .icon-arrow {
      transform: rotate(90deg);
      width: 18px;
      height: 18px;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-left: auto;
    }

    .navigation a {
      position: relative;
      padding: 12px 0;
      color: var(--navy);
      font-size: 20px;
      font-weight: 500;
      white-space: nowrap;
    }

    .navigation a.active {
      font-weight: 600;
    }

    .navigation a.active::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -2px;
      left: 0;
      height: 4px;
      border-radius: 4px;
      background: var(--navy);
    }

    .header__actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-left: 20px;
    }

    .points {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 18px;
      border-radius: 58px;
      background: linear-gradient(135deg, #3280f3, #0c336c);
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .coin {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 2px solid #ffe588;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffdf6d, #ffb300);
      color: #7a4b00;
      font-size: 14px;
      font-weight: 900;
    }
.profile {
      display: grid;
      place-items: center;
      width: 49px;
      height: 49px;
      border-radius: 50%;
      background: #b2d1ff;
      color: var(--navy);
      flex-shrink: 0;
    }

    /* MAIN DASHBOARD CONTENT */
    .dashboard {
      width: min(1508px, calc(100% - 64px));
      margin: 140px auto 32px; /* Top margin disesuaikan agar tidak tertutup header fixed */
    }

    .dashboard__top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 46px;
      align-items: start;
    }

    .section-title {
      margin: 0 0 24px;
      color: var(--navy);
      font-size: 24px;
      font-weight: 600;
      line-height: 1.2;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 58px;
      padding: 0 25px;
      border-radius: 45px;
      background: #ffffff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.17);
    }

    .search .icon {
      width: 21px;
      height: 21px;
      color: #111111;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      font-weight: 500;
    }

    .search input::placeholder {
      color: rgba(0, 0, 0, 0.5);
    }

    /* Search bar Beranda — struktur dan gaya dari LaporJalanUser.html */
    .kk-searchbar { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    .kk-search { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid #d3def5; border-radius: 45px; padding: 0 14px; box-shadow: 0 2px 5px rgba(0,0,0,.17); }
    .kk-search:focus-within { border-color: var(--navy); background: #fff; }
    .kk-search .icon { width: 21px; height: 21px; color: #111; flex-shrink: 0; }
    #cariLokasi { flex: 1; width: 100%; min-width: 0; border: 0; outline: none; background: transparent; color: var(--text); padding: 12px 6px; font-family: inherit; font-size: 16px; font-weight: 500; }
    #cariLokasi::placeholder { color: rgba(0,0,0,.5); }
    #kkCariHapus { border: 0; background: transparent; color: #7b88a6; cursor: pointer; font-size: 15px; padding: 4px 6px; flex-shrink: 0; }
    .kk-suggest { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 900; max-height: 300px; overflow-y: auto; padding: 6px; background: #fff; border: 1px solid #e3eaf8; border-radius: 12px; box-shadow: 0 10px 30px rgba(10,36,99,.20); }
    .kk-suggest .sg { display: block; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font-family: inherit; cursor: pointer; }
    .kk-suggest .sg:hover, .kk-suggest .sg.fokus { background: #eef3fc; }
    .kk-suggest .sg b { display: block; color: #1d2a44; font-size: 14px; }
    .kk-suggest .sg span { color: #7b88a6; font-size: 12px; }

    /* Dropdown kota Indonesia */
    .kk-city-wrap { position: relative; flex: 0 0 auto; }
    .kk-city-arrow { margin-left: 2px; font-size: 13px; }
    .kk-city-panel {
      position: absolute; top: calc(100% + 12px); left: 0; z-index: 2000;
      width: min(430px, calc(100vw - 32px)); padding: 16px;
      border: 1px solid #e3eaf8; border-radius: 18px; background: #fff;
      box-shadow: 0 16px 40px rgba(9,46,109,.20); color: var(--text);
    }
    .kk-city-panel[hidden], .kk-suggest[hidden] { display: none !important; }
    .kk-city-label { display: block; margin-bottom: 8px; color: var(--navy); font-size: 13px; font-weight: 700; }
    #kotaCari { width: 100%; padding: 11px 13px; border: 1px solid #d3def5; border-radius: 11px; outline: none; }
    #kotaCari:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(9,46,109,.08); }
    .kk-city-list-head, .kk-city-option {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: center;
    }
    .kk-city-list-head { padding: 12px 10px 7px; color: #77839a; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .kk-city-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; max-height: 280px; overflow-y: auto; }
    .kk-city-option {
      width: 100%; padding: 10px; border: 0; border-radius: 10px; background: #fff;
      color: var(--text); text-align: left; cursor: pointer; font-size: 12px;
    }
    .kk-city-option:hover, .kk-city-option:focus-visible { outline: none; background: #eef3fc; }
    .kk-city-option strong { font-size: 13px; font-weight: 600; }
    .kk-city-option span { color: #65718a; }
    .kk-city-empty { margin: 12px 4px 2px; color: #65718a; font-size: 13px; }
    .kk-searchbar { display: flex; gap: 10px; align-items: stretch; margin-bottom: 8px; }
    .kk-search { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 58px; background: #fff; border: 1.5px solid #d3def5; border-radius: 45px; padding: 0 14px; box-shadow: 0 2px 5px rgba(0,0,0,.17); }
    .kk-search:focus-within { border-color: var(--navy); }
    .kk-search .icon { width: 21px; height: 21px; color: #111; flex-shrink: 0; }
    #kkCari { flex: 1; width: 100%; min-width: 0; border: 0; outline: none; background: transparent; color: var(--text); padding: 12px 6px; font-family: inherit; font-size: 16px; font-weight: 500; }
    #kkCari::placeholder { color: rgba(0,0,0,.5); }
    #kkCariHapus { border: 0; background: transparent; color: #7b88a6; cursor: pointer; font-size: 16px; padding: 4px 6px; flex-shrink: 0; }
    .kk-suggest { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 1200; max-height: 300px; overflow-y: auto; padding: 6px; background: #fff; border: 1px solid #e3eaf8; border-radius: 14px; box-shadow: 0 10px 30px rgba(10,36,99,.20); }
    .kk-suggest .sg { display: block; width: 100%; padding: 10px; border: 0; border-radius: 9px; background: transparent; text-align: left; font-family: inherit; cursor: pointer; }
    .kk-suggest .sg:hover, .kk-suggest .sg:focus-visible { outline: none; background: #eef3fc; }
    .kk-suggest .sg b { display: block; color: #1d2a44; font-size: 13px; }
    .kk-suggest .sg span { display: block; margin-top: 3px; color: #7b88a6; font-size: 11px; }
    .kk-chip { display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; gap: 7px; padding: 0 15px; border: 1.5px solid #d3def5; border-radius: 14px; background: #eef3fc; color: var(--navy); font-family: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .kk-chip:hover { background: #dfe9fb; }
    .kk-gps-icon { width: 17px; height: 17px; flex-shrink: 0; }
    @media (max-width: 767px) {
      .kk-city-panel { left: auto; right: 0; width: min(390px, calc(100vw - 24px)); padding: 12px; }
      .kk-searchbar { gap: 7px; }
      .kk-search { height: 40px !important; min-height: 40px; padding: 0 10px !important; gap: 5px !important; }
      #kkCari { padding: 8px 3px; font-size: 12px !important; }
      .kk-search .icon { width: 16px !important; height: 16px !important; }
      .kk-chip { padding: 0 9px; border-radius: 11px; gap: 4px; font-size: 11px; }
      .kk-gps-icon { width: 14px; height: 14px; }
    }
    .map {
      height: 539px;
      margin-top: 35px;
      overflow: hidden;
      border-radius: 45px;
      background: #ffffff;
      box-shadow: 0 3px 23px rgba(0, 0, 0, 0.15);
    }

    /* Peta Leaflet */
    #map {
      isolation: isolate;          /* z-index internal Leaflet tidak menimpa header fixed */
      font-family: "Inter", Arial, sans-serif;
    }

    .kk-pin { background: none; border: 0; }
    .kk-pin svg { display: block; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35)); }

    .kk-me {
      display: block;
      width: 22px;
      height: 22px;
      border: 3px solid #ffffff;
      border-radius: 50%;
      background: #1c6ef2;
      box-shadow: 0 0 0 0 rgba(28, 110, 242, 0.5), 0 1px 4px rgba(0, 0, 0, 0.4);
      animation: kk-pulse 2s infinite;
    }
    .kk-me--kota { background: #7048e8; animation: none; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4); }
    @keyframes kk-pulse {
      70%  { box-shadow: 0 0 0 14px rgba(28, 110, 242, 0), 0 1px 4px rgba(0, 0, 0, 0.4); }
      100% { box-shadow: 0 0 0 0 rgba(28, 110, 242, 0), 0 1px 4px rgba(0, 0, 0, 0.4); }
    }

    .kk-map-note {
      max-width: 260px;
      margin: 0 0 12px 12px !important;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
      color: var(--text);
      font-size: 12px;
      line-height: 1.4;
    }
    .kk-map-note[hidden] { display: none; }

    .leaflet-popup-content-wrapper { border-radius: 16px; }
    .leaflet-popup-content { margin: 14px 16px; font-family: "Inter", Arial, sans-serif; }
    .kk-pop__title { margin: 0 0 8px; color: var(--navy); font-size: 16px; font-weight: 600; line-height: 1.3; }
    .kk-pop__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .kk-badge { padding: 2px 10px; border-radius: 20px; background: #e9ecef; color: #343a40; font-size: 12px; font-weight: 600; text-transform: capitalize; }
    .kk-badge--ok { background: #d3f9d8; color: #2b8a3e; }
    .kk-badge--aktif { background: #dbe4ff; color: #364fc7; }
    .kk-badge--ringan { background: #fff3bf; color: #8a6d00; }
    .kk-badge--sedang { background: #ffe8cc; color: #d9480f; }
    .kk-badge--parah { background: #ffe3e3; color: #c92a2a; }
    .kk-pop__desc { margin: 0 0 8px; color: var(--text); font-size: 13px; line-height: 1.45; }
    .kk-pop__row { margin: 0 0 4px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .kk-pop__row strong { color: var(--text); }
    .kk-pop__btn { margin-top: 8px; padding: 7px 14px; border: 0; border-radius: 20px; background: var(--navy); color: #ffffff; font-size: 13px; font-weight: 600; }
    .kk-pop__btn:hover { background: #0c3d8f; }

    /* ISU TERDEKAT */
    .issues {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 632px;
      padding: 34px 30px;
      border-radius: 45px;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
    }

    .issue {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 97px;
      padding: 18px 20px 18px 24px;
      overflow: hidden;
      border: 1px solid #e2e2e2;
      border-radius: 25px;
      background: #f7f7f7;
    }

    .issue::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 9px;
      background: var(--danger);
    }

    .issue__title {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 600;
    }

    .issue__location,
    .issue__time {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .issue .icon {
      color: rgba(19, 27, 46, 0.48);
    }

    /* LAPORAN TERBARU */
    .latest {
      margin-top: 39px;
    }

    .reports {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 31px;
    }

    .report {
      position: relative;
      min-height: 269px;
      overflow: hidden;
      border-radius: 35px;
      background: #687482;
      color: #ffffff;
    }

    .report__image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .report::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 35%,
        rgba(0, 0, 0, 0.75) 100%
      );
    }

    .report__content {
      position: absolute;
      z-index: 1;
      right: 24px;
      bottom: 23px;
      left: 24px;
    }

    .report__title {
      margin: 0 0 4px;
      font-size: 24px;
      font-weight: 600;
    }

    .report__description {
      margin: 0;
      font-size: 16px;
    }

    /* RESPONSIVE */
    @media (max-width: 1400px) {
      .navigation {
        gap: 20px;
      }
      .navigation a {
        font-size: 17px;
      }
      .brand {
        font-size: 26px;
      }
      .dashboard__top {
        gap: 24px;
      }
    }

    @media (max-width: 1100px) {
      .header {
        flex-wrap: wrap;
      }

      .navigation {
        order: 3;
        width: 100%;
        justify-content: center;
        margin: 10px 0 0;
      }

      .dashboard__top {
        grid-template-columns: 1fr;
      }

      .map {
        height: 400px;
      }

      .issues {
        min-height: auto;
      }

      .reports {
        grid-template-columns: 1fr;
      }
    }
  

/* Responsive mobile layout — desktop styles remain unchanged */
@media (max-width: 767px) {
  html { overflow-x: hidden; }
  body { zoom: 1 !important; overflow-x: hidden; }
  .header {
    top: 8px !important;
    left: 8px !important;
    right: 8px !important;
    min-height: 0 !important;
    height: auto !important;
    padding: 10px 12px !important;
    display: flex !important;
    flex-flow: row wrap !important;
    align-items: center !important;
    justify-content: space-between !important;
    column-gap: 8px !important;
    row-gap: 10px !important;
    border-radius: 16px !important;
  }
  .header > .brand { order: 1 !important; flex: 0 1 auto !important; min-width: 0; gap: 5px !important; font-size: clamp(16px, 4.5vw, 21px) !important; white-space: nowrap; }
  .header > .brand svg { width: 22px !important; height: 30px !important; }
  .header > .city-picker { order: 2 !important; flex: 0 0 auto !important; height: 34px !important; padding: 0 9px !important; gap: 4px !important; font-size: 12px !important; white-space: nowrap; }
  .header > .city-picker .icon { width: 16px !important; height: 16px !important; }
  .header > .header__actions { display: contents !important; }
  .header .points { order: 3 !important; flex: 0 0 auto !important; height: 34px !important; padding: 0 9px !important; gap: 5px !important; font-size: 12px !important; white-space: nowrap; }
  .header .points .coin { width: 17px !important; height: 17px !important; font-size: 10px !important; }
  .header > .profile { order: 4 !important; display: inline-flex !important; flex: 0 0 34px !important; width: 34px !important; height: 34px !important; align-items: center !important; justify-content: center !important; margin: 0 !important; }
  .header > .profile .icon { width: 22px !important; height: 22px !important; }
  .header > .navigation { order: 5 !important; flex: 0 0 100% !important; width: 100% !important; min-width: 0 !important; margin: 0 !important; padding: 2px 0 0 !important; display: flex !important; flex-flow: row nowrap !important; align-items: center !important; justify-content: space-between !important; gap: clamp(6px, 2.5vw, 14px) !important; overflow-x: auto !important; scrollbar-width: none; }
  .header > .navigation::-webkit-scrollbar { display: none; }
  .header > .navigation a { flex: 0 0 auto !important; font-size: clamp(10px, 2.8vw, 13px) !important; line-height: 1.3 !important; padding: 7px 0 !important; white-space: nowrap !important; }
  .header > .navigation a.active::after { height: 2px !important; bottom: 0 !important; }
  body { padding-top: 112px; }
  img, video, iframe, canvas, svg { max-width: 100%; }
  main, .main-content, .main-content, .content, .page-content, .container, .wrapper, .dashboard-content, .content-wrapper {
    max-width: 100% !important;
  }
  main, .main-content, .content, .page-content, .dashboard-content, .content-wrapper { width: auto; }
  .main-content, .content, .page-content, .dashboard-content, .content-wrapper { margin-left: 12px !important; margin-right: 12px !important; }
  input, select, textarea { max-width: 100%; }
  table { display: block; max-width: 100%; overflow-x: auto; }
}
@media (max-width: 420px) {
  .header { padding: 8px 9px !important; column-gap: 5px !important; }
  .header > .brand { gap: 3px !important; font-size: 16px !important; }
  .header > .city-picker { padding: 0 7px !important; }
  .header .points { padding: 0 7px !important; }
  .header > .navigation { gap: 7px !important; }
  .header > .navigation a { font-size: 10px !important; }
}
/* >>> MOBILE-OPT >>> */
@media (max-width: 767px) {
  body { padding-top: 100px; }
  .dashboard { width: auto !important; margin: 0 12px 20px !important; }
  .dashboard__top { grid-template-columns: 1fr !important; gap: 14px !important; }
  .section-title { font-size: 16px !important; margin: 0 0 10px !important; }
  .search { height: 40px !important; padding: 0 14px !important; gap: 8px !important; }
  .search .icon { width: 16px !important; height: 16px !important; }
  .search input { font-size: 13px !important; }
  .map { height: 200px !important; margin-top: 12px !important; border-radius: 18px !important; }
  .issues { min-height: 0 !important; padding: 12px !important; gap: 8px !important; border-radius: 18px !important; }
  .issue { min-height: 0 !important; padding: 10px 12px 10px 16px !important; border-radius: 14px !important; gap: 8px !important; }
  .issue::before { width: 6px !important; }
  .issue__title { font-size: 14px !important; margin: 0 0 2px !important; }
  .issue__location, .issue__time { font-size: 11px !important; line-height: 1.35; }
  .issue .icon { width: 18px !important; height: 18px !important; }

    {name:'Jambi', province:'Jambi', lat:-1.6101, lon:103.6131, aliases:['jbi']},
    {name:'Bengkulu', province:'Bengkulu', lat:-3.7928, lon:102.2608, aliases:['bkl']},
    {name:'Ambon', province:'Maluku', lat:-3.6954, lon:128.1814, aliases:['amb']},
    {name:'Ternate', province:'Maluku Utara', lat:0.7893, lon:127.3774, aliases:['trt']},
    {name:'Kendari', province:'Sulawesi Tenggara', lat:-3.9985, lon:122.5129, aliases:['kdi']},
    {name:'Palu', province:'Sulawesi Tengah', lat:-0.9003, lon:119.8779, aliases:['plw']},
    {name:'Gorontalo', province:'Gorontalo', lat:0.5435, lon:123.0568, aliases:['gto']},
    {name:'Bontang', province:'Kalimantan Timur', lat:0.1333, lon:117.5000, aliases:[]},
    {name:'Sumedang', province:'Jawa Barat', lat:-6.8586, lon:107.9160, aliases:['smdg']}
  ];

  const $ = id => document.getElementById(id);
  const cityBtn = $('kotaBtn'), cityPanel = $('kotaPanel'), cityInput = $('kotaCari');
  const cityLabel = $('kotaLabel'), cityList = $('kotaList'), cityEmpty = $('kotaKosong');
  const searchInput = $('kkCari'), clearBtn = $('kkCariHapus'), suggestPanel = $('kkSuggest');
  const gpsBtn = $('btnLokasiSaya'), legacySearch = $('cariLokasi');
  let searchTimer = null, activeRequest = 0, searchMarker = null, gpsMarker = null;

  function normalize(value) {
    return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }
  function fuzzyScore(query, candidate) {
    const q = normalize(query), c = normalize(candidate);
    if (!q) return 1;
    if (c === q) return 100;
    if (c.startsWith(q)) return 80;
    if (c.includes(q)) return 60;
    const words = c.split(' ');
    if (words.some(word => word.startsWith(q))) return 45;
    // Approximate typo tolerance: allow one missing/extra character for longer terms.
    if (q.length >= 4 && words.some(word => Math.abs(word.length - q.length) <= 1 &&
        (word.includes(q) || q.includes(word)))) return 25;
    return 0;
  }

  function getMap() { return window.kkLeafletMap || window.map || window.leafletMap || window.peta || null; }
  function ensureMapReady(callback) {
    const map = getMap();
    if (map && typeof map.setView === 'function') callback(map);
    else setTimeout(() => {
      const later = getMap();
      if (later && typeof later.setView === 'function') callback(later);
      else console.warn('Peta Leaflet belum tersedia. Pastikan js/dashboard.js membuat peta pada #map.');
    }, 700);
  }
  function moveMap(lat, lon, zoom, title, kind) {
    ensureMapReady(map => {
      map.setView([lat, lon], zoom, {animate:true});
      if (!window.L) return;
      const icon = window.L.divIcon({
        className: 'kk-search-marker',
        html: kind === 'gps'
          ? '<span class="kk-map-dot kk-map-dot-gps"></span>'
          : '<span class="kk-map-dot"></span>',
        iconSize: [24, 24], iconAnchor: [12, 12]
      });
      const target = kind === 'gps' ? 'gps' : 'search';
      if (target === 'gps') {
        if (gpsMarker) map.removeLayer(gpsMarker);
        gpsMarker = window.L.marker([lat, lon], {icon, title:title || 'Lokasi saya'}).addTo(map);
        gpsMarker.bindPopup(title || 'Lokasi saya');
      } else {
        if (searchMarker) map.removeLayer(searchMarker);
        searchMarker = window.L.marker([lat, lon], {icon, title:title || 'Lokasi pilihan'}).addTo(map);
        searchMarker.bindPopup(title || 'Lokasi pilihan').openPopup();
      }
      setTimeout(() => map.invalidateSize(), 120);
    });
  }

  function renderCities(query) {
    if (!cityList) return;
    const q = normalize(query);
    const ranked = cities.map(city => {
      const candidates = [city.name, city.province, ...city.aliases];
      const score = Math.max(...candidates.map(candidate => fuzzyScore(q, candidate)));
      return {city, score};
    }).filter(item => !q || item.score > 0)
      .sort((a,b) => b.score - a.score || a.city.name.localeCompare(b.city.name, 'id'));
    cityList.replaceChildren();
    ranked.forEach(({city}) => {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'kk-city-option'; button.setAttribute('role','option');
      const name = document.createElement('strong'); name.textContent = city.name;
      const province = document.createElement('span'); province.textContent = city.province;
      button.append(name, province);
      button.addEventListener('click', () => selectCity(city));
      cityList.appendChild(button);
    });
    if (cityEmpty) cityEmpty.hidden = ranked.length > 0;
  }
  function selectCity(city) {
    cityLabel.textContent = city.name;
    cityBtn.setAttribute('aria-label', 'Pilih kota: ' + city.name);
    cityBtn.setAttribute('aria-expanded', 'false');
    cityPanel.hidden = true;
    localStorage.setItem('kotakita.selectedCity', JSON.stringify({name:city.name, province:city.province, lat:city.lat, lon:city.lon}));
    moveMap(city.lat, city.lon, 13, city.name + ', ' + city.province, 'city');
  }

  if (cityBtn && cityPanel) {
    let savedCity = null;
    try { savedCity = JSON.parse(localStorage.getItem('kotakita.selectedCity') || 'null'); } catch (_) {}
    const initialCity = cities.find(city => savedCity && normalize(city.name) === normalize(savedCity.name))
      || cities.find(city => city.name === 'Bandung');
    cityLabel.textContent = initialCity.name;
    renderCities('');
    cityBtn.addEventListener('click', () => {
      cityPanel.hidden = !cityPanel.hidden;
      cityBtn.setAttribute('aria-expanded', String(!cityPanel.hidden));
      if (!cityPanel.hidden) { renderCities(cityInput.value); cityInput.focus(); }
    });
    cityInput.addEventListener('input', () => renderCities(cityInput.value));
    document.addEventListener('click', event => {
      if (!event.target.closest('.kk-city-wrap')) {
        cityPanel.hidden = true; cityBtn.setAttribute('aria-expanded','false');
      }
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        cityPanel.hidden = true; suggestPanel.hidden = true;
        cityBtn.setAttribute('aria-expanded','false');
      }
    });
    // Terapkan kota yang tersimpan atau default setelah peta siap.
    const cityToApply = savedCity ? (cities.find(city => normalize(city.name) === normalize(savedCity.name)) || initialCity) : initialCity;
    moveMap(cityToApply.lat, cityToApply.lon, 12, cityToApply.name + ', ' + cityToApply.province, 'city');
  }

  function renderSuggestions(items, query) {
    suggestPanel.replaceChildren();
    if (!items.length) {
      const empty = document.createElement('div');
      empty.className = 'sg'; empty.textContent = query ? 'Lokasi tidak ditemukan. Coba kata kunci lain.' : '';
      suggestPanel.appendChild(empty); suggestPanel.hidden = !query;
      return;
    }
    items.forEach(item => {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'sg'; button.setAttribute('role','option');
      const title = document.createElement('b');
      title.textContent = item.name || item.display_name || 'Lokasi';
      const detail = document.createElement('span');
      detail.textContent = item.detail || item.display_name || '';
      button.append(title, detail);
      button.addEventListener('click', () => {
        const lat = Number(item.lat), lon = Number(item.lon);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
        searchInput.value = item.name || item.display_name || '';
        if (legacySearch) { legacySearch.value = searchInput.value; legacySearch.dispatchEvent(new Event('input', {bubbles:true})); }
        syncClearButton(); suggestPanel.hidden = true;
        moveMap(lat, lon, 16, searchInput.value, 'search');
      });
      suggestPanel.appendChild(button);
    });
    suggestPanel.hidden = false;
  }

  async function geocode(query, requestId) {
    const endpoint = 'https://photon.komoot.io/api/?q=' + encodeURIComponent(query) +
      '&lat=-2.5&lon=118&limit=7&lang=id';
    try {
      const response = await fetch(endpoint, {headers:{'Accept':'application/json'}});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      if (requestId !== activeRequest) return;
      const items = (data.features || []).map(feature => {
        const props = feature.properties || {};
        const coords = feature.geometry && feature.geometry.coordinates || [];
        const parts = [props.street, props.name, props.city, props.district, props.state, props.country]
          .filter((v, i, a) => v && a.indexOf(v) === i);
        return {
          name: props.name || props.street || props.city || props.district || 'Lokasi',
          detail: parts.join(', '),
          lat: coords[1], lon: coords[0]
        };
      });
      renderSuggestions(items, query);
    } catch (error) {
      if (requestId !== activeRequest) return;
      renderSuggestions([], query);
      console.warn('Geocoding Photon gagal:', error);
    }
  }

  function syncClearButton() {
    if (clearBtn) clearBtn.hidden = !searchInput.value.trim();
  }
  if (searchInput) {
    searchInput.addEventListener('input', () => {
      syncClearButton();
      if (legacySearch) {
        legacySearch.value = searchInput.value;
        legacySearch.dispatchEvent(new Event('input', {bubbles:true}));
      }
      clearTimeout(searchTimer);
      const query = searchInput.value.trim();
      if (query.length < 3) { suggestPanel.hidden = true; return; }
      searchTimer = setTimeout(() => {
        const requestId = ++activeRequest;
        geocode(query, requestId);
      }, 350);
    });
    searchInput.addEventListener('keydown', event => {
      if (event.key === 'Escape') suggestPanel.hidden = true;
      if (event.key === 'Enter') {
        const first = suggestPanel.querySelector('.sg');
        if (!suggestPanel.hidden && first && first.tagName === 'BUTTON') { event.preventDefault(); first.click(); }
      }
    });
    clearBtn.addEventListener('click', () => {
      searchInput.value = ''; syncClearButton(); suggestPanel.hidden = true;
      if (legacySearch) { legacySearch.value = ''; legacySearch.dispatchEvent(new Event('input', {bubbles:true})); }
      searchInput.focus();
    });
    document.addEventListener('click', event => {
      if (!event.target.closest('.kk-searchbar')) suggestPanel.hidden = true;
    });
  }

  if (gpsBtn) gpsBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      alert('Browser ini tidak mendukung GPS.'); return;
    }
    gpsBtn.disabled = true;
    const oldText = gpsBtn.querySelector('span');
    if (oldText) oldText.textContent = 'Mencari lokasi…';
    navigator.geolocation.getCurrentPosition(position => {
      const {latitude, longitude, accuracy} = position.coords;
      moveMap(latitude, longitude, 16, 'Lokasi saya (akurasi ±' + Math.round(accuracy) + ' m)', 'gps');
      gpsBtn.disabled = false;
      if (oldText) oldText.textContent = 'Lokasi saya';
    }, error => {
      gpsBtn.disabled = false;
      if (oldText) oldText.textContent = 'Lokasi saya';
      const message = error.code === 1
        ? 'Izin lokasi ditolak. Aktifkan izin lokasi pada browser.'
        : error.code === 2 ? 'Lokasi tidak tersedia. Coba lagi di tempat terbuka.'
        : 'Permintaan GPS terlalu lama. Coba lagi.';
      alert(message);
    }, {enableHighAccuracy:true, timeout:12000, maximumAge:30000});
  });
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const go = (url) => { if (url) window.location.href = url; };

  // Kontrol hapus untuk search bar Beranda.
  const inputCariBeranda = document.getElementById('cariLokasi');
  const tombolHapusCari = document.getElementById('kkCariHapus');
  const saranCariBeranda = document.getElementById('kkSuggest');
  if (inputCariBeranda && tombolHapusCari) {
    const sinkronTombolHapus = () => { tombolHapusCari.hidden = !inputCariBeranda.value.trim(); };
    inputCariBeranda.addEventListener('input', sinkronTombolHapus);
    tombolHapusCari.addEventListener('click', () => {
      inputCariBeranda.value = '';
      sinkronTombolHapus();
      if (saranCariBeranda) saranCariBeranda.hidden = true;
      inputCariBeranda.focus();
      inputCariBeranda.dispatchEvent(new Event('input', { bubbles: true }));
    });
    sinkronTombolHapus();
  }
  document.querySelectorAll('form').forEach(form => form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (form.classList.contains('login__form')) { go('dashboard.html'); return; }
    if (form.classList.contains('registration__form')) { go('login.html'); return; }
    if (form.querySelector('input[type="file"]')) { go('detail-after-UploadLaporan.html'); return; }
  }));
  document.querySelectorAll('.issue-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.issue-btn').forEach(x => x.classList.remove('selected')); btn.classList.add('selected');
  }));
  document.querySelectorAll('.filter').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(x => x.classList.remove('active')); btn.classList.add('active');
  }));
  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    const c=btn.className; if(c.includes('vouchers')) go('Profil-Poin(Semua).html#voucher'); else if(c.includes('history')) go('rekamLaporan.html'); else go('Profil-Poin(Semua).html');
  }));
  document.querySelectorAll('.save').forEach(btn => btn.addEventListener('click', () => { alert('Perubahan berhasil disimpan.'); }));
  document.querySelectorAll('.logout').forEach(btn => btn.addEventListener('click', () => go('welcome.html')));
  document.querySelectorAll('.btn-confirm').forEach(btn => btn.addEventListener('click', () => go('detail-after-UploadLaporan.html')));
  document.querySelectorAll('.detail-button.withdraw').forEach(btn => btn.addEventListener('click', () => { if(confirm('Tarik laporan ini?')) go('rekamLaporan.html'); }));
  document.querySelectorAll('.download').forEach(btn => btn.addEventListener('click', () => {
    const blob=new Blob(['Riwayat laporan KotaKita'],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='riwayat-laporan.txt'; a.click(); URL.revokeObjectURL(a.href);
  }));
  document.querySelectorAll('.redeem:not(:disabled)').forEach(btn => btn.addEventListener('click', () => alert('Penukaran poin dipilih. Konfirmasi transaksi memerlukan backend aplikasi.')));
  document.querySelectorAll('.action').forEach(btn => btn.addEventListener('click', () => alert(btn.classList.contains('feedback')?'Terima kasih atas masukan Anda.':'Silakan gunakan kanal kontak resmi KotaKita.')));
  // Dropdown kota ditangani oleh modul fitur pencarian lokasi di atas.
  document.querySelectorAll('.avatar-upload').forEach(btn => btn.addEventListener('click', () => {
    let i=document.querySelector('#avatar-file'); if(!i){i=document.createElement('input');i.type='file';i.id='avatar-file';i.accept='image/*';i.hidden=true;document.body.appendChild(i);} i.click();
  }));
  document.querySelectorAll('.location-card__edit-btn').forEach(btn => btn.addEventListener('click', () => go('lokasi.html')));
});
</script>
</body>
</html>
