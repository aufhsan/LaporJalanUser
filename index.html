<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lapor Jalan Rusak</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f6f9; color: #333; }
        header { background: #6f42c1; color: white; padding: 14px; text-align: center; font-size: 18px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .page { padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .btn { background: #6f42c1; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 10px 0; width: 100%; transition: 0.2s; }
        .btn:disabled { background: #cccccc; cursor: not-allowed; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; }
        .btn-warning { background: #fd7e14; }
        #preview { max-width: 100%; max-height: 250px; margin-top: 15px; display: none; border-radius: 8px; border: 2px dashed #ddd; }
        .info { background: #e9ecef; padding: 15px; border-radius: 5px; margin-top: 15px; display: none; text-align: left; font-size: 14px; line-height: 1.5; }
        #areaKonfirmasi { display: none; margin-top: 10px; }
        #areaKonfirmasi .pertanyaan { font-weight: bold; margin: 10px 0 0; }
    </style>
</head>
<body>
    <header>📱 Lapor Jalan Rusak</header>

    <div class="page">
        <div class="card">
            <h2>Lapor Jalan Rusak</h2>
            <p>Ambil foto kerusakannya, lokasi GPS akan otomatis terekam. Anda bisa memeriksa dulu sebelum mengirim.</p>

            <input type="file" accept="image/*" capture="environment" id="pilihKamera" style="display: none;">
            <button class="btn" id="btnFoto">📸 Ambil Foto Jalan</button>

            <img id="preview" alt="Preview Foto">

            <div id="infoStatus" class="info">
                <span id="statusTeks">Menunggu kiriman foto...</span>
            </div>

            <button class="btn btn-warning" id="btnUlangGPS" style="display: none;">🔄 Coba GPS Lagi</button>

            <div id="areaKonfirmasi">
                <p class="pertanyaan">Periksa foto dan lokasi di atas. Kirim laporan ini?</p>
                <button class="btn btn-success" id="btnKirim">✅ Ya, Kirim Laporan</button>
                <button class="btn btn-danger" id="btnBatal">❌ Batal / Foto Ulang</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://ilmnhyyarurqszcyidnx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsbW5oeXlhcnVycXN6Y3lpZG54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1Nzc0MzQsImV4cCI6MjEwNzE1MzQzNH0.sbvZvD_WOHvpTpwy6dc9Kcdql4BLqKjQR10v5VmJrFo";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const inputKamera = document.getElementById('pilihKamera');
        const previewImg = document.getElementById('preview');
        const infoStatus = document.getElementById('infoStatus');
        const statusTeks = document.getElementById('statusTeks');
        const areaKonfirmasi = document.getElementById('areaKonfirmasi');
        const btnKirim = document.getElementById('btnKirim');
        const btnBatal = document.getElementById('btnBatal');
        const btnUlangGPS = document.getElementById('btnUlangGPS');
        const btnFoto = document.getElementById('btnFoto');

        let fileFotoRaw = null;
        let dataLokasi = { latitude: null, longitude: null, akurasi: null };

        btnFoto.addEventListener('click', () => inputKamera.click());

        function resetFormUser() {
            fileFotoRaw = null;
            dataLokasi = { latitude: null, longitude: null, akurasi: null };
            inputKamera.value = "";
            previewImg.style.display = "none";
            areaKonfirmasi.style.display = "none";
            btnUlangGPS.style.display = "none";
        }

        inputKamera.addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                fileFotoRaw = e.target.files[0];
                previewImg.src = URL.createObjectURL(fileFotoRaw);
                previewImg.style.display = "inline-block";
                infoStatus.style.display = "block";
                areaKonfirmasi.style.display = "none";
                btnUlangGPS.style.display = "none";
                ambilGPS();
            }
        });

        function ambilGPS() {
            if (!navigator.geolocation) {
                statusTeks.innerText = "❌ Browser perangkat Anda tidak mendukung GPS.";
                btnUlangGPS.style.display = "block";
                return;
            }
            statusTeks.innerHTML = "📸 Foto terekam.<br>⏳ Mencari sinyal GPS akurat...";
            btnUlangGPS.style.display = "none";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    dataLokasi.latitude = position.coords.latitude;
                    dataLokasi.longitude = position.coords.longitude;
                    dataLokasi.akurasi = position.coords.accuracy;
                    statusTeks.innerHTML = `✅ <b>GPS Berhasil Dikunci!</b><br>Lat: ${dataLokasi.latitude}<br>Lng: ${dataLokasi.longitude}<br>Akurasi: ±${Math.round(dataLokasi.akurasi)} meter`;
                    areaKonfirmasi.style.display = "block";
                    btnKirim.disabled = false;
                    btnBatal.disabled = false;
                },
                (error) => {
                    statusTeks.innerHTML = "❌ GPS gagal (" + error.message + "). Aktifkan layanan lokasi & izinkan akses lokasi untuk browser, lalu coba lagi.";
                    btnUlangGPS.style.display = "block";
                },
                { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
            );
        }

        btnUlangGPS.addEventListener('click', ambilGPS);

        btnBatal.addEventListener('click', () => {
            resetFormUser();
            statusTeks.innerText = "Laporan dibatalkan. Silakan ambil foto ulang.";
        });

        btnKirim.addEventListener('click', async () => {
            if (!fileFotoRaw || dataLokasi.latitude === null) return;
            btnKirim.disabled = true;
            btnBatal.disabled = true;
            statusTeks.innerText = "⏳ Mengunggah foto...";

            try {
                const namaFile = `jalan_${Date.now()}_${Math.random().toString(36).slice(2, 8)}.jpg`;
                const { error: uploadError } = await db.storage
                    .from('foto_laporan')
                    .upload(namaFile, fileFotoRaw, { contentType: fileFotoRaw.type || 'image/jpeg' });
                if (uploadError) throw uploadError;

                const { data: urlData } = db.storage.from('foto_laporan').getPublicUrl(namaFile);

                statusTeks.innerText = "⏳ Menyimpan data lokasi...";

                const { error: insertError } = await db
                    .from('laporan_jalan')
                    .insert([{ latitude: dataLokasi.latitude, longitude: dataLokasi.longitude, foto_url: urlData.publicUrl }]);
                if (insertError) throw insertError;

                resetFormUser();
                statusTeks.innerHTML = "🎉 Sukses! Laporan jalan rusak Anda sudah terkirim. Terima kasih!";
            } catch (error) {
                console.error(error);
                statusTeks.innerHTML = "❌ Gagal mengirim: " + (error.message || "gangguan jaringan");
                btnKirim.disabled = false;
                btnBatal.disabled = false;
            }
        });
    </script>
</body>
</html>
