<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Redirect otomatis menggunakan Meta Refresh -->
    <meta http-equiv="refresh" content="0; url=FRONT-END/welcome.html">
    <title>Mengarahkan ke KotaKita...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            color: #334155;
        }
        .redirect-container {
            text-align: center;
            padding: 2rem;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.25rem;
            color: #1e293b;
        }
        p {
            margin: 0 0 1rem 0;
            font-size: 0.95rem;
            color: #64748b;
        }
        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        // Redirect cadangan via JavaScript jika Meta Refresh diblokir browser
        window.location.href = "FRONT-END/welcome.html";
    </script>
</head>
<body>
    <div class="redirect-container">
        <div class="spinner"></div>
        <h2>Sedang Mengalihkan...</h2>
        <p>Jika halaman tidak terbuka secara otomatis, klik tombol di bawah ini:</p>
        <a href="FRONT-END/welcome.html">Buka Halaman Welcome</a>
    </div>
</body>
</html>
